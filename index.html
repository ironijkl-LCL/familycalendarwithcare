<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麟李互助家庭日誌</title>

<style>
body { font-family: Arial, sans-serif; margin:0; font-size:18px; background:#f5f5f5; }

header {
    background:#25D366;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container { padding:10px; }

.card {
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* 頭 */
.calendar-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 15px;
}

.nav-btn {
    width:25%;
    padding:10px;
    font-size:16px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.month-title {
    font-size:22px;
    font-weight:bold;
}

/* 星期 */
.weekdays-container {
    display: block;
    width: 100%;
    margin-bottom: 5px;
}

.weekday {
    display:inline-block;
    width:14.28%;
    text-align:center;
    color:gray;
    font-weight:bold;
    font-size:16px;
}

/* 非Grid */
.calendar { font-size:0; }

.calendar-day {
    display:inline-block;
    width:14.28%;
    padding:6px 2px;
    text-align:center;
    background:white;
    border-radius:10px;
    margin-bottom:6px;
    min-height:110px;
    font-size:18px;
    vertical-align: top;
    box-sizing: border-box;
    cursor: pointer;
    border: 1px solid #f0f0f0;
    overflow: hidden;
}

.calendar-day:hover {
    background: #e8f9ed;
}

.empty { 
    background:transparent; 
    border: none;
    cursor: default;
}
.empty:hover { background:transparent; }

.today { border:3px solid orange; }
.selected-day { background: #d0f5db !important; border: 2px solid #25D366; }

/* 農曆 */
.lunar {
    font-size:12px;
    color:#666;
    margin-top: 2px;
}

/* 🔴 假期 */
.holiday {
    font-size:11px;
    color:red;
    font-weight:bold;
    margin-top: 2px;
    line-height: 1.2;
}

/* 格子內的活動條樣式 */
.day-event-badge {
    font-size: 11px;
    background: #e6f7ff;
    color: #1890ff;
    border-left: 3px solid #1890ff;
    padding: 2px 4px;
    margin-top: 3px;
    text-align: left;
    border-radius: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
}

/* 按鈕 */
button.action-btn {
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button.action-btn:hover {
    background:#20ba59;
}

button.delete-btn {
    background:#ff4d4f;
    padding:6px 12px;
    color:white;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
}

button.edit-btn {
    background:#1890ff;
    padding:6px 12px;
    color:white;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    margin-right: 5px;
}

/* WhatsApp 快捷按鈕樣式 */
button.whatsapp-btn {
    background:#25D366;
    padding:6px 12px;
    color:white;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    font-weight: bold;
}
button.whatsapp-btn:hover { background:#20ba59; }

input, textarea {
    width:100%;
    padding:12px;
    margin:6px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px;
}

.event-item {
    background: #f9f9f9;
    padding: 12px;
    border-left: 4px solid #25D366;
    margin-bottom: 8px;
    border-radius: 0 8px 8px 0;
    font-size: 16px;
    overflow: hidden;
}

.event-time {
    font-weight: bold;
    color: #333;
}

.event-desc {
    margin-top: 4px;
    color: #555;
}

/* 參與者複選群組排版 */
.member-checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 6px 0 14px 0;
}
.member-label {
    font-size: 15px;
    display: flex;
    align-items: center;
    cursor: pointer;
    background: #f0f0f0;
    padding: 6px 12px;
    border-radius: 20px;
    user-select: none;
    transition: background 0.2s;
}
.member-label:hover {
    background: #e0e0e0;
}
.member-label input[type="checkbox"] {
    width: auto;
    margin: 0 6px 0 0;
    transform: scale(1.3);
    cursor: pointer;
}
.btn-text-span {
    padding-right: 2px;
    color: #333;
    font-weight: 500;
    display: inline-block;
}
.phone-indicator {
    font-size: 11px;
    color: #1890ff;
    margin-left: 3px;
}

/* 高級黑半透明彈窗遮罩層與容器樣式 */
.popup-overlay {
    display: none; 
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55); 
    z-index: 1000;
    overflow-y: auto; 
}

.popup-content-card {
    position: relative;
    background: white;
    width: 90%;
    max-width: 550px;
    margin: 50px auto; 
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    animation: popupSlideIn 0.3s ease-out; 
}

/* 關閉 X 按鈕樣式 */
.popup-close-x {
    position: absolute;
    top: 15px;
    right: 18px;
    font-size: 24px;
    color: #8c8c8c;
    cursor: pointer;
    font-weight: bold;
    user-select: none;
}
.popup-close-x:hover {
    color: #333;
}

/* 彈窗動畫 */
@keyframes popupSlideIn {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* 密碼驗證鎖控制區域樣式 */
.password-lock-section {
    background: #fffbe6;
    border: 1px solid #ffe58f;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    text-align: center;
}

/* 附表設定表單與管理面板控制層 */
.secure-form-fields {
    display: none; 
    margin-top: 15px;
}

/* 管理舊活動與 WhatsApp 清單內的條目排版 */
.manage-item-row {
    background: #f5f5f5;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* 雙模合一智慧型輸入列排版樣式 */
.twin-input-wrapper {
    display: flex;
    align-items: center;
    position: relative;
    width: 100%;
}
.twin-input-wrapper input[type="text"] {
    flex: 1;
    padding-right: 90px; 
}
.wheel-trigger-box {
    position: absolute;
    right: 8px;
    display: flex;
    gap: 5px;
}
.wheel-btn {
    background: #e6f7ff;
    color: #1890ff;
    border: 1px solid #91d5ff;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}
.wheel-btn:hover {
    background: #1890ff;
    color: white;
}
.hidden-wheel-picker {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
}
</style>
</head>

<body>

<header>📅 麟李互助家庭日誌</header>

<div class="container">

    <div class="card">
        <div class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)">⬅ 上一月</button>
            <div id="monthLabel" class="month-title"></div>
            <button class="nav-btn" onclick="changeMonth(1)">下一月 ➡</button>
        </div>

        <div class="weekdays-container">
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
        </div>

        <div id="calendar" class="calendar"></div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; color:#333;">📋 <span id="selectedDateLabel"></span> 活動日程</h3>
        <div id="dayEvents"></div>
    </div>

    <div class="card" style="display: flex; flex-direction: column; gap: 8px; padding: 10px;">
        <button class="action-btn" style="background: #25D366; font-size: 17px; padding: 12px; margin: 0;" onclick="openAddFormPopup('ADD')">➕ 新增家庭活動</button>
        <div style="display: flex; gap: 8px;">
            <button class="action-btn" style="background: #1890ff; font-size: 16px; padding: 12px; margin: 0; flex: 1;" onclick="openAddFormPopup('MANAGE')">⚙️ 管理/修改舊活動</button>
            <button class="action-btn" style="background: #00c642; font-size: 16px; padding: 12px; margin: 0; flex: 1;" onclick="openAddFormPopup('WHATSAPP')">💬 傳送 WhatsApp 通知</button>
        </div>
    </div>

    <div class="popup-overlay" id="addEventPopupOverlay" onclick="closePopupOverlayOutside(event)">
        <div class="popup-content-card" id="popupInnerCard">
            <span class="popup-close-x" onclick="closeEventPopup()">&times;</span>
            
            <h3 id="formTitle" style="margin-top:0; color:#333; padding-right: 20px;">➕ 新增家庭活動</h3>
            <input type="hidden" id="editKey" value="">

            <div class="password-lock-section" id="lockSection">
                <div style="display:flex; gap:8px;">
                    <input type="password" id="popupPassword" placeholder="輸入密碼進入..." style="margin:0; flex:1; padding:10px;">
                    <button type="button" class="action-btn" style="margin:0; width:auto; padding:10px 20px; background:#1890ff;" onclick="verifyGatePassword()">確認進入</button>
                </div>
            </div>

            <div class="secure-form-fields" id="secureFormPanel">
                <label for="eventTitle" style="font-size:15px; color:#666; margin-top: 10px; display: block;">活動名稱 / 地點：</label>
                <input type="text" id="eventTitle" placeholder="例如：陪爺爺飲茶、家族聚餐、樂活金掌家會議">

                <label for="eventTime" style="font-size:15px; color:#666; display: block;">活動時間：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="eventTime" value="18:00" placeholder="例如：18:00 或 下午6:00">
                    <div class="wheel-trigger-box">
                        <button type="button" class="wheel-btn" onclick="triggerTimeWheel('eventTime', 'nativeTimeWheelA')">⏰ 自選</button>
                    </div>
                    <input type="time" id="nativeTimeWheelA" class="hidden-wheel-picker" onchange="syncWheelToText('nativeTimeWheelA', 'eventTime', 'TIME')">
                </div>

                <label for="notifyTime" style="font-size:15px; color:#666; display: block; margin-top:10px;">WhatsApp 提醒發送時間：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="notifyTime" value="17:00" placeholder="例如：6月1日 17:00 或 明日下午5點">
                    <div class="wheel-trigger-box">
                        <button type="button" class="wheel-btn" onclick="triggerTimeWheel('notifyTime', 'nativeDateWheel')">📅 日期</button>
                        <button type="button" class="wheel-btn" onclick="triggerTimeWheel('notifyTime', 'nativeTimeWheelB')">⏰ 時間</button>
                    </div>
                    <input type="date" id="nativeDateWheel" class="hidden-wheel-picker" onchange="syncWheelToText('nativeDateWheel', 'notifyTime', 'DATE')">
                    <input type="time" id="nativeTimeWheelB" class="hidden-wheel-picker" onchange="syncWheelToText('nativeTimeWheelB', 'notifyTime', 'TIME_APPEND')">
                </div>
                
                <label style="font-size:15px; color:#666; display: block; margin-top: 12px;">活動參與者：</label>
                <div class="member-checkbox-group" id="memberCheckboxContainer">
                    <label class="member-label" id="slot_label_1"><input type="checkbox" name="members" id="slot_cb_1" value="爸爸" onclick="syncTargetPhone(1)"> <span class="btn-text-span" onclick="modifyMemberPrompt(1, event)">爸爸</span></label>
                    <label class="member-label" id="slot_label_2"><input type="checkbox" name="members" id="slot_cb_2" value="媽媽" onclick="syncTargetPhone(2)"> <span class="btn-text-span" onclick="modifyMemberPrompt(2, event)">媽媽</span></label>
                    <label class="member-label" id="slot_label_3"><input type="checkbox" name="members" id="slot_cb_3" value="爺爺" onclick="syncTargetPhone(3)"> <span class="btn-text-span" onclick="modifyMemberPrompt(3, event)">爺爺</span></label>
                    <label class="member-label" id="slot_label_4"><input type="checkbox" name="members" id="slot_cb_4" value="嫲嫲" onclick="syncTargetPhone(4)"> <span class="btn-text-span" onclick="modifyMemberPrompt(4, event)">嫲嫲</span></label>
                    <label class="member-label" id="slot_label_5"><input type="checkbox" name="members" id="slot_cb_5" value="小明" onclick="syncTargetPhone(5)"> <span class="btn-text-span" onclick="modifyMemberPrompt(5, event)">小明</span></label>
                    <label class="member-label" id="slot_label_6"><input type="checkbox" name="members" id="slot_cb_6" value="治療師" onclick="syncTargetPhone(6)"> <span class="btn-text-span" onclick="modifyMemberPrompt(6, event)">治療師</span></label>
                    <label class="member-label" id="slot_label_7"><input type="checkbox" name="members" id="slot_cb_7" value="叔叔" onclick="syncTargetPhone(7)"> <span class="btn-text-span" onclick="modifyMemberPrompt(7, event)">叔叔</span></label>
                    <label class="member-label" id="slot_label_8"><input type="checkbox" name="members" id="slot_cb_8" value="嬸嬸" onclick="syncTargetPhone(8)"> <span class="btn-text-span" onclick="modifyMemberPrompt(8, event)">嬸嬸</span></label>
                    <label class="member-label" id="slot_label_9"><input type="checkbox" name="members" id="slot_cb_9" value="姑姐" onclick="syncTargetPhone(9)"> <span class="btn-text-span" onclick="modifyMemberPrompt(9, event)">姑姐</span></label>
                    <label class="member-label" id="slot_label_10"><input type="checkbox" name="members" id="slot_cb_10" value="鄰居" onclick="syncTargetPhone(10)"> <span class="btn-text-span" onclick="modifyMemberPrompt(10, event)">鄰居</span></label>
                </div>

                <label for="targetPhone" style="font-size:15px; color:#666; display: block;">接收者 / 通知對象電話號碼：</label>
                <input type="tel" id="targetPhone" placeholder="例如：91234567 (留空則發送到大群組)">

                <label for="whatsappBtnText" style="font-size:15px; color:#666; display: block;">自訂 WhatsApp 按鈕鍵顯示名稱：</label>
                <input type="text" id="whatsappBtnText" value="💬 WhatsApp 通知" placeholder="可以自訂修改按鈕文字名稱">

                <label for="eventNote" style="font-size:15px; color:#666; display: block;">備註：</label>
                <textarea id="eventNote" rows="2" placeholder="詳細備忘事項..."></textarea>
                
                <button id="submitBtn" class="action-btn" style="background:#25D366; margin-top: 15px;" onclick="addFamilyEvent()">儲存至此日期</button>
            </div>

            <div class="secure-form-fields" id="secureManagePanel">
                <label style="font-size:15px; color:#666; font-weight:bold; display:block; margin-bottom:10px;">請選擇欲修改或刪除的舊行程：</label>
                <div id="popupManageList"></div>
            </div>

            <div class="secure-form-fields" id="secureWhatsAppPanel">
                <label style="font-size:15px; color:#666; font-weight:bold; display:block; margin-bottom:10px;">請選擇欲傳送 WhatsApp 通知的行程項目：</label>
                <div id="popupWhatsAppList"></div>
            </div>
            
            <button id="cancelBtn" class="action-btn" style="background:#8c8c8c; margin-top:15px;" onclick="closeEventPopup()">關閉面板</button>
        </div>
    </div>

</div>

<script>

const dbURL = "https://familycalender-a62ae-default-rtdb.firebaseio.com/family_calendar_activities";

let activities = [];
let current = new Date();
let selectedDateStr = new Date().toISOString().slice(0, 10); 
let currentPopupMode = "ADD"; 

let slotsMapping = JSON.parse(localStorage.getItem('member_slots_extended_config')) || {
    1: { name: "爸爸", phone: "" },
    2: { name: "媽媽", phone: "" },
    3: { name: "爺爺", phone: "" },
    4: { name: "嫲嫲", phone: "" },
    5: { name: "小明", phone: "" },
    6: { name: "治療師", phone: "" },
    7: { name: "叔叔", phone: "" },
    8: { name: "嬸嬸", phone: "" },
    9: { name: "姑姐", phone: "" },
    10: { name: "鄰居", phone: "" }
};

function triggerTimeWheel(txtInputId, nativePickerId) {
    let picker = document.getElementById(nativePickerId);
    if (picker) {
        picker.showPicker(); 
    }
}

function syncWheelToText(pickerId, txtInputId, type) {
    let picker = document.getElementById(pickerId);
    let txtInput = document.getElementById(txtInputId);
    if (!picker || !picker.value || !txtInput) return;

    if (type === 'TIME') {
        txtInput.value = picker.value;
    } else if (type === 'DATE') {
        let d = new Date(picker.value);
        if (!isNaN(d.getTime())) {
            let m = d.getMonth() + 1;
            let dateVal = d.getDate();
            txtInput.value = `${m}月${dateVal}日`;
        }
    } else if (type === 'TIME_APPEND') {
        let currentTxt = txtInput.value.trim();
        if (currentTxt.includes("日")) {
            let datePart = currentTxt.split("日")[0] + "日";
            txtInput.value = `${datePart} ${picker.value}`;
        } else {
            txtInput.value = currentTxt ? `${currentTxt} ${picker.value}` : picker.value;
        }
    }
}

function verifyGatePassword() {
    let passwordInput = document.getElementById('popupPassword');
    if (passwordInput.value === "8679") {
        document.getElementById('lockSection').style.display = 'none';
        passwordInput.value = ""; 

        if (currentPopupMode === "MANAGE") {
            document.getElementById('secureManagePanel').style.display = 'block';
            renderPopupManageListUI(); 
        } else if (currentPopupMode === "WHATSAPP") {
            document.getElementById('secureWhatsAppPanel').style.display = 'block';
            renderPopupWhatsAppListUI(); 
        } else {
            document.getElementById('secureFormPanel').style.display = 'block';
            document.getElementById('eventTitle').focus();
        }
    } else {
        alert("❌ 密碼錯誤，無法開啟詳細設定欄位！");
        passwordInput.value = "";
        passwordInput.focus();
    }
}

function openAddFormPopup(mode) {
    currentPopupMode = mode || "ADD";
    
    document.getElementById('lockSection').style.display = 'block';
    document.getElementById('secureFormPanel').style.display = 'none';
    document.getElementById('secureManagePanel').style.display = 'none';
    document.getElementById('secureWhatsAppPanel').style.display = 'none';

    if (currentPopupMode === "MANAGE") {
        document.getElementById('formTitle').innerText = "⚙️ 管理/修改舊活動";
    } else if (currentPopupMode === "WHATSAPP") {
        document.getElementById('formTitle').innerText = "💬 傳送 WhatsApp 通知";
    } else {
        document.getElementById('formTitle').innerText = "➕ 新增家庭活動";
    }
    
    document.getElementById('addEventPopupOverlay').style.display = 'block';
    document.body.style.overflow = 'hidden'; 
    document.getElementById('popupPassword').focus();
}

function renderPopupManageListUI() {
    let container = document.getElementById('popupManageList');
    let filtered = activities.filter(a => a.date === selectedDateStr);
    filtered.sort((a, b) => a.time.localeCompare(b.time));

    if (filtered.length === 0) {
        container.innerHTML = `<p style="color:gray; font-size:16px; text-align:center; padding:10px;">此日期暫無安排活動項目。</p>`;
        return;
    }

    let html = "";
    filtered.forEach(ev => {
        html += `
        <div class="manage-item-row">
            <div style="flex:1; padding-right:10px; font-size:16px;">
                <strong>${ev.time}</strong> - ${ev.title}
            </div>
            <div style="display:flex;">
                <button class="edit-btn" onclick="triggerEditFromPopup('${ev.id}')">✏️ 修改</button>
                <button class="delete-btn" onclick="deleteEventFromPopup('${ev.id}')">❌ 刪除</button>
            </div>
        </div>
        `;
    });
    container.innerHTML = html;
}

function renderPopupWhatsAppListUI() {
    let container = document.getElementById('popupWhatsAppList');
    let filtered = activities.filter(a => a.date === selectedDateStr);
    filtered.sort((a, b) => a.time.localeCompare(b.time));

    if (filtered.length === 0) {
        container.innerHTML = `<p style="color:gray; font-size:16px; text-align:center; padding:10px;">此日期暫無可傳送通知的項目。</p>`;
        return;
    }

    let html = "";
    filtered.forEach(ev => {
        let btnLabel = ev.whatsappBtnText || "💬 WhatsApp 通知"; 
        html += `
        <div class="manage-item-row">
            <div style="flex:1; padding-right:10px; font-size:16px;">
                <strong>${ev.time}</strong> - ${ev.title}
            </div>
            <div>
                <button class="whatsapp-btn" onclick="sendWhatsAppNotification('${ev.id}')">${btnLabel}</button>
            </div>
        </div>
        `;
    });
    container.innerHTML = html;
}

function triggerEditFromPopup(id) {
    let ev = activities.find(a => a.id === id);
    if (!ev) return;

    document.getElementById('editKey').value = ev.id;
    document.getElementById('eventTitle').value = ev.title;
    document.getElementById('eventTime').value = ev.time;
    document.getElementById('notifyTime').value = ev.notifyTime;
    document.getElementById('targetPhone').value = ev.targetPhone || "";
    document.getElementById('eventNote').value = ev.note;
    document.getElementById('whatsappBtnText').value = ev.whatsappBtnText || "💬 WhatsApp 通知";

    if (ev.slotsSnapshot) {
        slotsMapping = ev.slotsSnapshot;
        refreshMemberButtonsUI();
    }

    let checkboxes = document.querySelectorAll('input[name="members"]');
    checkboxes.forEach(cb => {

    document.getElementById('submitBtn').innerText = "確認修改更新至雲端";

    document.getElementById('secureManagePanel').style.display = 'none';
    document.getElementById('secureFormPanel').style.display = 'block';

// ─── 🔄 完美重寫：點擊名字文字獨立跳轉彈窗進行改名稱與修改電話 ───
function modifyMemberPrompt(slotId, event) {
    // 嚴格阻斷冒泡，避免點擊文字影響到 checkbox 方格的狀態
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    let currentName = slotsMapping[slotId].name;
    let currentPhone = slotsMapping[slotId].phone;

    let newName = prompt(`請輸入新的參與者顯示名稱：`, currentName);
    if (newName === null) return; 
    newName = newName.trim();
    if (!newName) newName = currentName; 

    let newPhone = prompt(`請輸入 [ ${newName} ] 的 WhatsApp 電話號碼：\n(若要發送到大群組此處可留空)`, currentPhone);
    if (newPhone === null) return;
    newPhone = newPhone.replace(/\s+/g, ''); 

    slotsMapping[slotId].name = newName;
    slotsMapping[slotId].phone = newPhone;
    
    refreshMemberButtonsUI();
}

function fetchCloudData() {
    fetch(`${dbURL}.json`, { method: "GET", mode: "cors" })
        .then(response => response.json())
        .then(data => {
            activities = [];
            if (data) {
                for (let key in data) {
                    if (data[key]) {
                        if (data[key].slotsSnapshot) {
                            for(let id in data[key].slotsSnapshot){
                                if(data[key].slotsSnapshot[id].name) {
                                    slotsMapping[id] = data[key].slotsSnapshot[id];
                                }
                            }
                        }

                        activities.push({
                            id: key,
                            date: data[key].date,
                            time: data[key].time,
                            notifyTime: data[key].notifyTime || "17:00",
                            title: data[key].title,
                            members: data[key].members || [], 
                            targetPhone: data[key].targetPhone || "",
                            slotsSnapshot: data[key].slotsSnapshot || {}, 
                            whatsappBtnText: data[key].whatsappBtnText || "💬 WhatsApp 通知", 
                            note: data[key].note
                        });
                    }
                }
            }
            refreshMemberButtonsUI(); 
            renderCalendar();
            renderDayEvents();
            
            if(document.getElementById('secureManagePanel').style.display === 'block') {
                renderPopupManageListUI(); 
            }
            if(document.getElementById('secureWhatsAppPanel').style.display === 'block') {
                renderPopupWhatsAppListUI();
            }
        })
        .catch(error => {
            console.error(error);
        });
}

setInterval(fetchCloudData, 4000);

const holidays = {
    "01-01":"元旦", "04-04":"清明節", "05-01":"勞動節", "07-01":"香港回歸日", "10-01":"國慶日", "12-25":"聖誕節", "12-26":"聖誕翌日"
};

function getDynamicHoliday(y, m, d) {
    let mm = String(m).padStart(2, '0'); let dd = String(d).padStart(2, '0'); let key = `${mm}-${dd}`;
    if (holidays[key]) return holidays[key];
    if (y === 2026) {
        if (key === "02-17") return "年初一"; if (key === "02-18") return "年初二"; if (key === "02-19") return "年初三";
        if (key === "04-03") return "受難節"; if (key === "04-06") return "復活節"; if (key === "05-24") return "佛誕";
        if (key === "06-19") return "端午節"; if (key === "09-26") return "中秋翌日"; if (key === "10-19") return "重陽節";
    }
    if (y === 2027) {
        if (key === "02-06") return "年初一"; if (key === "02-08") return "年初二"; if (key === "02-09") return "年初三";
        if (key === "03-26") return "受難節"; if (key === "03-29") return "復活節"; if (key === "05-13") return "佛誕";
        if (key === "06-09") return "端午節"; if (key === "09-16") return "中秋翌日"; if (key === "10-08") return "重陽節";
    }
    return "";
}

function getLunar(date){
    try {
        let d = new Date(date); if (isNaN(d.getTime())) return "";
        let parts = new Intl.DateTimeFormat("zh-Hant-u-ca-chinese", {month:"numeric", day:"numeric"}).formatToParts(d);
        let month = parts.find(p=>p.type==='month').value; let day = parts.find(p=>p.type==='day').value;
        const CN=["","一","二","三","四","五","六","七","八","九","十"];
        function dCN(n){ n=Number(n); if(n<=10) return "初"+CN[n]; if(n<20) return "十"+CN[n-10]; if(n==20) return "二十"; if(n<30) return "廿"+CN[n-20]; return "三十"; }
        function mCN(n){ return ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","臘月"][n]; }
        return day==1 ? mCN(month) : dCN(day);
    } catch(e) { return ""; }
}

function selectDate(dateStr) {
    selectedDateStr = dateStr;
    let cells = document.querySelectorAll('.calendar-day');
    cells.forEach(cell => {
        if (cell.getAttribute('data-date') === dateStr) { cell.classList.add('selected-day'); } else { cell.classList.remove('selected-day'); }
    });
    renderDayEvents();
}

function sendWhatsAppNotification(id) {
    let ev = activities.find(a => a.id === id);
    if (!ev) return;

    let remark = ev.note ? `\n📝 備註備忘：${ev.note}` : "";
    let participants = ev.members && ev.members.length > 0 ? ev.members.join('、') : "全體成員";

    let textMessage = `💡【麟李互助家庭日誌 - 行程提醒】\n\n📢 有一項最新日程提醒：\n\n📅 日期：${ev.date}\n⏰ 活動時間：${ev.time}\n👥 活動參與者：${participants}\n📌 項目名稱 / 地點：${ev.title}${remark}\n\n🔔 提醒發送設定為：${ev.notifyTime}，請大家留意安排，互相照顧扶持！❤️`;

    let cleanPhone = ev.targetPhone ? ev.targetPhone.replace(/\s+/g, '') : "";
    if (cleanPhone) {
        if (cleanPhone.length === 8 && /^[569]/.test(cleanPhone)) {
            cleanPhone = "852" + cleanPhone; 
        }
    }

    let whatsappUrl = cleanPhone ? 
        `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(textMessage)}` : 
        `https://api.whatsapp.com/send?text=${encodeURIComponent(textMessage)}`;
    
    window.open(whatsappUrl, '_blank');
}

function renderDayEvents() {
    document.getElementById('selectedDateLabel').innerText = selectedDateStr;
    let dayEventsContainer = document.getElementById('dayEvents');
    let filtered = activities.filter(a => a.date === selectedDateStr);
    
    filtered.sort((a, b) => a.time.localeCompare(b.time));
    if (filtered.length === 0) {
        dayEventsContainer.innerHTML = `<p style="color:gray; font-size:16px;">此日期暫無安排家庭活動。</p>`;
        return;
    }
    
    let html = "";
    filtered.forEach(ev => {
        let membersTxt = ev.members && ev.members.length > 0 ? `👥 活動參與者：${ev.members.join('、')}` : "👥 活動參與者：全體成員";
        let phoneInfo = ev.targetPhone ? `<div class="event-desc" style="font-size:14px; color:#1890ff;">📞 指定接收號碼：${ev.targetPhone}</div>` : `<div class="event-desc" style="font-size:14px; color:#8c8c8c;">👥 接收對象：家庭大群組 / 自選聯絡人</div>`;

        html += `
        <div class="event-item">
            <div class="event-time">⏰ 活動時間：${ev.time}</div>
            <div class="event-desc" style="font-size:14px; color:#666;">🔔 提醒發送時間：${ev.notifyTime}</div>
            <div class="event-desc">📌 <strong>${ev.title}</strong></div>
            <div class="event-desc" style="font-size:14px; color:#555;">${membersTxt}</div>
            ${phoneInfo}
            ${ev.note ? `<div class="event-desc" style="font-size:14px; color:#777; padding-left:14px;">📝 ${ev.note}</div>` : ""}
        </div>
        `;
    });
    dayEventsContainer.innerHTML = html;
}

function addFamilyEvent() {
    let titleInput = document.getElementById('eventTitle');
    let timeInput = document.getElementById('eventTime');
    let notifyTimeInput = document.getElementById('notifyTime');
    let targetPhoneInput = document.getElementById('targetPhone');
    let noteInput = document.getElementById('eventNote');
    let whatsappBtnTextInput = document.getElementById('whatsappBtnText');
    let editKey = document.getElementById('editKey').value;
    
    if (!titleInput.value.trim()) {
        alert("請輸入活動名稱或地點！");
        return;
    }

    let checkedMembers = [];
    let checkboxes = document.querySelectorAll('input[name="members"]:checked');
    checkboxes.forEach(cb => { checkedMembers.push(cb.value); });
    
    let eventData = {
        date: selectedDateStr,
        time: timeInput.value.trim() || "18:00",
        notifyTime: notifyTimeInput.value.trim() || "17:00", 
        title: titleInput.value.trim(),
        members: checkedMembers, 
        targetPhone: targetPhoneInput.value.trim(), 
        slotsSnapshot: slotsMapping, 
        whatsappBtnText: whatsappBtnTextInput.value.trim() || "💬 WhatsApp 通知", 
        note: noteInput.value.trim()
    };

    let targetURL = editKey ? `${dbURL}/${editKey}.json` : `${dbURL}.json`;
    let reqMethod = editKey ? "PUT" : "POST";

    fetch(targetURL, {
        method: reqMethod,
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(eventData)
    })
    .then(response => response.json())
    .then(() => {
        closeEventPopup(); 
        fetchCloudData();
    })
    .catch(err => {
        alert("儲存未成功，請確認 Firebase Rules 規則。");
        console.error(err);
    });
}

function deleteEventFromPopup(id) {
    if (confirm("確定要刪除這項活動嗎？")) {
        fetch(`${dbURL}/${id}.json`, { method: "DELETE", mode: "cors" })
            .then(() => { fetchCloudData(); });
    }
}

function renderCalendar(){
    let y = current.getFullYear(); let m = current.getMonth();
    monthLabel.innerText = y + "年 " + (m + 1) + "月";
    let first = new Date(y, m, 1).getDay(); let days = new Date(y, m + 1, 0).getDate();
    let html = "", total = 0;

    for(let i=0; i<first; i++){ html += `<div class="calendar-day empty"></div>`; total++; }

    for(let i=1; i<=days; i++){
        let dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        let isToday = new Date().toISOString().slice(0,10) === dStr;
        let isSelected = selectedDateStr === dStr;
        let lunar = getLunar(dStr); let holiday = getDynamicHoliday(y, m+1, i);
        
        let dayActivities = activities.filter(a => a.date === dStr);
        dayActivities.sort((a, b) => a.time.localeCompare(b.time));

        let eventsHtml = "";
        dayActivities.forEach(act => {
            eventsHtml += `<span class="day-event-badge" title="${act.time} ${act.title}">${act.time} ${act.title}</span>`;
        });
        let dayClass = "calendar-day";
        if (isToday) dayClass += " today";
        if (isSelected) dayClass += " selected-day";
        html += `
        <div class="${dayClass}" data-date="${dStr}" onclick="selectDate('${dStr}')">
            <strong>${i}</strong>
            <div class="lunar">${lunar}</div>
            ${holiday ? `<div class="holiday">🔴 ${holiday}</div>` : ""}
            <div class="day-events-container">${eventsHtml}</div>
        </div>
        `;
        total++;
    }
    while(total % 7 !== 0){ html += `<div class="calendar-day empty"></div>`; total++; }
    calendar.innerHTML = html;
}

function changeMonth(n){ current.setMonth(current.getMonth() + n); renderCalendar(); }
