<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麟李互助家庭日誌</title>

<style>
body { font-family: Arial, sans-serif; margin:0; font-size:18px; background:#f5f5f5; }

header {
    background:#25D366;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container { padding:10px; }

.card {
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* 頭 */
.calendar-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 15px;
}

.nav-btn {
    width:25%;
    padding:10px;
    font-size:16px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.month-title {
    font-size:22px;
    font-weight:bold;
}

/* 星期 - 🛠️ 優化：使用 Flex 排版徹底解決走位問題 */
.weekdays-container {
    display: flex;
    width: 100%;
    margin-bottom: 5px;
}

.weekday {
    flex: 1;
    text-align:center;
    color:gray;
    font-weight:bold;
    font-size:16px;
}

/* 日曆格子區域 - 🛠️ 優化：改用 flex-wrap 彈性排版確保六日完美對齊 */
.calendar { 
    font-size:0; 
    display: flex;
    flex-wrap: wrap;
    width: 100%;
}

.calendar-day {
    display: inline-block;
    width: 14.2857%;
    padding:6px 2px;
    text-align:center;
    background:white;
    border-radius:10px;
    margin-bottom:6px;
    min-height:110px;
    font-size:18px;
    vertical-align: top;
    box-sizing: border-box;
    cursor: pointer;
    border: 1px solid #f0f0f0;
    overflow: hidden;
}

.calendar-day:hover {
    background: #e8f9ed;
}

.empty { 
    background:transparent; 
    border: none;
    cursor: default;
}
.empty:hover { background:transparent; }

.today { border:3px solid orange;
}
.selected-day { background: #d0f5db !important; border: 2px solid #25D366; }

/* 農曆 */
.lunar {
    font-size:12px;
    color:#666;
    margin-top: 2px;
}

/* 🔴 假期 */
.holiday {
    font-size:11px;
    color:red;
    font-weight:bold;
    margin-top: 2px;
    line-height: 1.2;
}

/* 格子內的活動條樣式 */
.day-event-badge {
    font-size: 11px;
    background: #e6f7ff;
    color: #1890ff;
    border-left: 3px solid #1890ff;
    padding: 2px 4px;
    margin-top: 3px;
    text-align: left;
    border-radius: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
}

/* 按鈕 */
button.action-btn {
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button.action-btn:hover {
    background:#20ba59;
}

button.delete-btn {
    background:#ff4d4f;
    padding:6px 12px;
    color:white;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
}

button.edit-btn {
    background:#1890ff;
    padding:6px 12px;
    color:white;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    margin-right: 5px;
}

/* WhatsApp 快捷按鈕樣式 */
button.whatsapp-btn {
    background:#25D366;
    padding:6px 12px;
    color:white;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    font-weight: bold;
}
button.whatsapp-btn:hover { background:#20ba59; }

input, textarea {
    width:100%;
    padding:12px;
    margin:6px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px;
}

.event-item {
    background: #f9f9f9;
    padding: 12px;
    border-left: 4px solid #25D366;
    margin-bottom: 8px;
    border-radius: 0 8px 8px 0;
    font-size: 16px;
    overflow: hidden;
}

.event-time {
    font-weight: bold;
    color: #333;
}

.event-desc {
    margin-top: 4px;
    color: #555;
}

/* 參與者複選群組排版 */
.member-checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 6px 0 14px 0;
}
.member-label {
    font-size: 15px;
    display: flex;
    align-items: center;
    cursor: pointer;
    background: #f0f0f0;
    padding: 6px 12px;
    border-radius: 20px;
    user-select: none;
    transition: background 0.2s;
}
.member-label:hover {
    background: #e0e0e0;
}
.member-label input[type="checkbox"] {
    width: auto;
    margin: 0 6px 0 0;
    transform: scale(1.3);
    cursor: pointer;
}
.btn-text-span {
    padding-right: 2px;
    color: #333;
    font-weight: 500;
    display: inline-block;
}
.phone-indicator {
    font-size: 11px;
    color: #1890ff;
    margin-left: 3px;
}

/* 高級黑半透明彈窗遮罩層與容器樣式 */
.popup-overlay {
    display: none; 
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55); 
    z-index: 1000;
    overflow-y: auto; 
}

.popup-content-card {
    position: relative;
    background: white;
    width: 90%;
    max-width: 550px;
    margin: 50px auto; 
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    animation: popupSlideIn 0.3s ease-out; 
}

/* 關閉 X 按鈕樣式 */
.popup-close-x {
    position: absolute;
    top: 15px;
    right: 18px;
    font-size: 24px;
    color: #8c8c8c;
    cursor: pointer;
    font-weight: bold;
    user-select: none;
}
.popup-close-x:hover {
    color: #333;
}

/* 彈窗動畫 */
@keyframes popupSlideIn {
    from { transform: translateY(-30px); opacity: 0;
    }
    to { transform: translateY(0); opacity: 1; }
}

/* 密碼驗證鎖控制區域樣式 */
.password-lock-section {
    background: #fffbe6;
    border: 1px solid #ffe58f;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    text-align: center;
}

/* 附表設定表單與管理面板控制層 */
.secure-form-fields {
    display: none; 
    margin-top: 15px;
}

/* 管理舊活動與 WhatsApp 清單內的條目排版 */
.manage-item-row {
    background: #f5f5f5;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* 雙模合一智慧型輸入列排版樣式 */
.twin-input-wrapper {
    display: flex;
    align-items: center;
    position: relative;
    width: 100%;
}
.twin-input-wrapper input[type="text"] {
    flex: 1;
    padding-right: 90px; 
}
.wheel-trigger-box {
    position: absolute;
    right: 8px;
    display: flex;
    gap: 5px;
}
.wheel-btn {
    background: #e6f7ff;
    color: #1890ff;
    border: 1px solid #91d5ff;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}
.wheel-btn:hover {
    background: #1890ff;
    color: white;
}
.hidden-wheel-picker {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
}

/* 修改成員自訂彈窗排版與輸入框優化 */
.member-edit-fields {
    margin-top: 15px;
}

/* ─── 🔄 動態視圖切換模式 CSS 控制群 ─── */
/* 精簡視圖 */
.view-精簡 .day-event-badge {
    display: none !important;
}

/* 疊放視圖 */
.view-疊放 .day-event-badge {
    padding: 1px 2px !important;
    margin-top: 1px !important;
    font-size: 10px !important;
    line-height: 1.1 !important;
    border-left-width: 2px !important;
}

/* 詳細資料視圖 */
.view-詳細資料 .calendar-day {
    min-height: 140px !important;
}
.view-詳細資料 .day-event-badge {
    white-space: normal !important;
    word-break: break-all !important;
    overflow: visible !important;
    text-overflow: clip !important;
}

/* 視圖切換單選列樣式 */
.view-option-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 15px;
}
.view-radio-label {
    display: flex;
    align-items: center;
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
.view-radio-label input {
    width: auto;
    margin: 0 10px 0 0;
    transform: scale(1.3);
}
</style>
</head>

<body class="view-列表" id="bodyNode">

<header>📅 麟李互助家庭日誌</header>

<div class="container">

    <div class="card">
        <div class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)">⬅ 上一月</button>
            <div id="monthLabel" class="month-title"></div>
            <button class="nav-btn" onclick="changeMonth(1)">下一月 ➡</button>
        </div>

        <div class="weekdays-container">
            <div class="weekday">日</div>
 
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
        </div>

        <div id="calendar" class="calendar"></div>
    </div>

 
    <div class="card">
        <h3 style="margin-top:0; color:#333;">📋 <span id="selectedDateLabel"></span> 活動日程</h3>
        <div id="dayEvents"></div>
    </div>

    <div class="card" style="display: flex; flex-direction: row; gap: 10px; padding: 12px; justify-content: center; align-items: center; flex-wrap: wrap;">
        <button class="action-btn" style="background: #25D366; font-size: 24px; padding: 12px; margin: 0; flex: 1; border-radius: 12px; display: flex; justify-content: center; align-items: center;" onclick="openAddFormPopup('ADD')" title="新增家庭活動">➕</button>
        <div style="display: flex; gap: 10px; flex: 2; width: 100%;">
            <button class="action-btn" style="background: #1890ff; font-size: 24px; padding: 12px; margin: 0; flex: 1; border-radius: 12px; display: flex; justify-content: center; align-items: center;" onclick="openAddFormPopup('MANAGE')" title="管理/修改舊活動">⚙️</button>
            <button class="action-btn" style="background: #00c642; font-size: 24px; padding: 12px; margin: 0; flex: 1; border-radius: 12px; display: flex; justify-content: center; align-items: center;" onclick="openAddFormPopup('WHATSAPP')" title="傳送 WhatsApp 通知">💬</button>
            <button class="action-btn" style="background: #722ed1; font-size: 24px; padding: 12px; margin: 0; flex: 1; border-radius: 12px; display: flex; justify-content: center; align-items: center;" onclick="openAddFormPopup('SWITCH_VIEW')" title="視誌視圖切換">👁️</button>
        </div>
    </div>

    <div class="popup-overlay" id="addEventPopupOverlay" onclick="closePopupOverlayOutside(event)">
        <div class="popup-content-card" id="popupInnerCard">
            <span class="popup-close-x" onclick="closeEventPopup()">&times;</span>
            
            <h3 id="formTitle" style="margin-top:0; color:#333; padding-right: 20px;">➕ 新增家庭活動</h3>
            <input type="hidden" id="editKey" value="">

            <div class="password-lock-section" id="lockSection">
                <div style="display:flex; gap:8px;">
                    <input type="password" id="popupPassword" placeholder="輸入密碼進入..." style="margin:0; flex:1; padding:10px;">
                    <button type="button" class="action-btn" style="margin:0; width:auto; padding:10px 20px; background:#1890ff;" onclick="verifyGatePassword()">確認進入</button>
                </div>
            </div>

            <div class="secure-form-fields" id="secureFormPanel">
                <label for="eventTitle" style="font-size:15px; color:#666; margin-top: 10px; display: block;">活動名稱 / 地點：</label>
                <input type="text" id="eventTitle" placeholder="例如：陪爺爺飲茶、家族聚餐、樂活金掌家會議">

                <label for="eventTime" style="font-size:15px; color:#666; display: block;">活動時間：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="eventTime" value="18:00" placeholder="例如：18:00 或 下午6:00">
                    <div class="wheel-trigger-box">
                        <button type="button" class="wheel-btn" onclick="triggerTimeWheel('eventTime', 'nativeTimeWheelA')">⏰ 自選</button>
                    </div>
                    <input type="time" id="nativeTimeWheelA" class="hidden-wheel-picker" onchange="syncWheelToText('nativeTimeWheelA', 'eventTime', 'TIME')">
                </div>

                <label for="notifyTime" style="font-size:15px; color:#666; display: block; margin-top:10px;">WhatsApp 提醒發送時間：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="notifyTime" value="17:00" placeholder="例如：6月1日 17:00 或 明日下午5點">
                    <div class="wheel-trigger-box">
                        <button type="button" class="wheel-btn" onclick="triggerTimeWheel('notifyTime', 'nativeDateWheel')">📅 日期</button>
                       <button type="button" class="wheel-btn" onclick="triggerTimeWheel('notifyTime', 'nativeTimeWheelB')">⏰ 時間</button>
                    </div>
                    <input type="date" id="nativeDateWheel" class="hidden-wheel-picker" onchange="syncWheelToText('nativeDateWheel', 'notifyTime', 'DATE')">
                    <input type="time" id="nativeTimeWheelB" class="hidden-wheel-picker" onchange="syncWheelToText('nativeTimeWheelB', 'notifyTime', 'TIME_APPEND')">
                </div>
                
                <label style="font-size:15px; color:#666; display: block; margin-top: 12px;">活動參與者：</label>
                <div class="member-checkbox-group" id="memberCheckboxContainer">
                    <label class="member-label" id="slot_label_1"><input type="checkbox" name="members" id="slot_cb_1" value="阿鐵" onclick="syncTargetPhone(1)"> <span class="btn-text-span" onclick="modifyMemberPrompt(1, event)">阿鐵</span></label>
                    <label class="member-label" id="slot_label_2"><input type="checkbox" name="members" id="slot_cb_2" value="Jolie" onclick="syncTargetPhone(2)"> <span class="btn-text-span" onclick="modifyMemberPrompt(2, event)">Jolie</span></label>
                    <label class="member-label" id="slot_label_3"><input type="checkbox" name="members" id="slot_cb_3" value="Daddy" onclick="syncTargetPhone(3)"> <span class="btn-text-span" onclick="modifyMemberPrompt(3, event)">Daddy</span></label>
                    <label class="member-label" id="slot_label_4"><input type="checkbox" name="members" id="slot_cb_4" value="Mummy" onclick="syncTargetPhone(4)"> <span class="btn-text-span" onclick="modifyMemberPrompt(4, event)">Mummy</span></label>
                    <label class="member-label" id="slot_label_5"><input type="checkbox" name="members" id="slot_cb_5" value="Karis" onclick="syncTargetPhone(5)"> <span class="btn-text-span" onclick="modifyMemberPrompt(5, event)">Karis</span></label>
                    <label class="member-label" id="slot_label_6"><input type="checkbox" name="members" id="slot_cb_6" value="Leisel" onclick="syncTargetPhone(6)"> <span class="btn-text-span" onclick="modifyMemberPrompt(6, event)">Leisel</span></label>
                    <label class="member-label" id="slot_label_7"><input type="checkbox" name="members" id="slot_cb_7" value="Debby" onclick="syncTargetPhone(7)"> <span class="btn-text-span" onclick="modifyMemberPrompt(7, event)">Debby</span></label>
                    <label class="member-label" id="slot_label_8"><input type="checkbox" name="members" id="slot_cb_8" value="Hardy" onclick="syncTargetPhone(8)"> <span class="btn-text-span" onclick="modifyMemberPrompt(8, event)">Hardy</span></label>
                    <label class="member-label" id="slot_label_9"><input type="checkbox" name="members" id="slot_cb_9" value="姑姐" onclick="syncTargetPhone(9)"> <span class="btn-text-span" onclick="modifyMemberPrompt(9, event)">姑姐</span></label>
                    <label class="member-label" id="slot_label_10"><input type="checkbox" name="members" id="slot_cb_10" value="鄰居" onclick="syncTargetPhone(10)"> <span class="btn-text-span" onclick="modifyMemberPrompt(10, event)">鄰居</span></label>
                    <label class="member-label" id="slot_label_11"><input type="checkbox" name="members" id="slot_cb_11" value="成員11" onclick="syncTargetPhone(11)"> <span class="btn-text-span" onclick="modifyMemberPrompt(11, event)">成員11</span></label>
                    <label class="member-label" id="slot_label_12"><input type="checkbox" name="members" id="slot_cb_12" value="成員12" onclick="syncTargetPhone(12)"> <span class="btn-text-span" onclick="modifyMemberPrompt(12, event)">成員12</span></label>
                </div>

                <label for="targetPhone" style="font-size:15px; color:#666; display: block;">接收者 / 通知對象電話號碼：</label>
                <input type="tel" id="targetPhone" placeholder="例如：91234567 (留空則發送到大群組)">

                <label for="whatsappBtnText" style="font-size:15px; color:#666; display: block;">自訂 WhatsApp 按鈕鍵顯示名稱：</label>
                <input type="text" id="whatsappBtnText" value="💬 WhatsApp 通知" placeholder="可以自訂修改按鈕文字名稱">

                <label for="eventNote" style="font-size:15px; color:#666; display: block;">備註：</label>
                <textarea id="eventNote" rows="2" placeholder="詳細備忘事項..."></textarea>
                
                <button id="submitBtn" class="action-btn" style="background:#25D366; margin-top: 15px;" onclick="addFamilyEvent()">儲存至此日期</button>
            </div>

            <div class="secure-form-fields" id="secureManagePanel">
                <label style="font-size:15px; color:#666; font-weight:bold; display:block; margin-bottom:10px;">請選擇欲修改或刪除的舊行程：</label>
                <div id="popupManageList"></div>
            </div>

            <div class="secure-form-fields" id="secureWhatsAppPanel">
                <label style="font-size:15px; color:#666; font-weight:bold; display:block; margin-bottom:10px;">請選擇欲傳送 WhatsApp 通知的行程項目：</label>
                <div id="popupWhatsAppList"></div>
            </div>

            <div class="secure-form-fields" id="secureViewSwitchPanel">
                <div class="view-option-group">
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="精簡" onclick="changeGlobalViewMode('精簡')"> ▤ 精簡</label>
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="疊放" onclick="changeGlobalViewMode('疊放')"> ⪢ 疊放</label>
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="詳細資料" onclick="changeGlobalViewMode('詳細資料')"> 📋 詳細資料</label>
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="列表" onclick="changeGlobalViewMode('列表')"> ✓ ☰ 列表</label>
                </div>
            </div>
            
            <button id="cancelBtn" class="action-btn" style="background:#8c8c8c; margin-top:15px;" onclick="closeEventPopup()">關閉面板</button>
        </div>
    </div>

    <div class="popup-overlay" id="memberEditPopupOverlay" onclick="closeMemberPopupOverlayOutside(event)">
        <div class="popup-content-card" style="max-width: 450px; margin: 100px auto;">
            <span class="popup-close-x" onclick="closeMemberEditPopup()">&times;</span>
            <h3 id="memberFormTitle" style="margin-top:0; color:#333; padding-right: 20px;">✏️ 修改成員資料</h3>
            
            <div class="password-lock-section" id="memberLockSection">
                <div style="display:flex; gap:8px;">
                    <input type="password" id="memberPopupPassword" placeholder="輸入密碼進入..." style="margin:0; flex:1; padding:10px;">
                    <button type="button" class="action-btn" style="margin:0; width:auto; padding:10px 20px; background:#1890ff;" onclick="verifyMemberGatePassword()">確認進入</button>
                </div>
            </div>

            <div class="secure-form-fields" id="secureMemberPanel">
                <input type="hidden" id="currentEditSlotId" value="">
                
                <label for="editMemberName" style="font-size:15px; color:#666; display: block; margin-top: 10px;">參與者顯示名稱：</label>
                <input type="text" id="editMemberName" placeholder="例如：陳先生">
                
                <label for="editMemberPhone" style="font-size:15px; color:#666; display: block; margin-top: 12px;">WhatsApp 電話號碼：</label>
                <input type="tel" id="editMemberPhone" placeholder="例如：91234567 (留空發送到大群組)">
                
                <button class="action-btn" style="background:#25D366; margin-top: 20px;" onclick="saveMemberSettings()">儲存更新</button>
            </div>
            <button class="action-btn" style="background:#8c8c8c; margin-top: 10px;" onclick="closeMemberEditPopup()">取消關閉</button>
        </div>
    </div>

    <div class="popup-overlay" id="whatsappAlertPopupOverlay">
        <div class="popup-content-card" style="max-width: 460px; margin: 120px auto; border: 3px solid #25D366; text-align: center;">
            <h3 style="margin-top:0; color:#25D366; font-size: 22px;">⏰ WhatsApp 發送提醒時間到了！</h3>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 12px 0;">
            <div id="whatsappAlertMessage" style="font-size: 17px; color: #333; text-align: left; line-height: 1.6; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px;"></div>

    let picker = document.getElementById(pickerId);
    let txtInput = document.getElementById(txtInputId);
    if (!picker || !picker.value || !txtInput) return;
    if (type === 'TIME') {
        txtInput.value = picker.value;
    } else if (type === 'DATE') {
        let d = new Date(picker.value);
        if (!isNaN(d.getTime())) {
            let m = d.getMonth() + 1;
            let dateVal = d.getDate();
            txtInput.value = `${m}月${dateVal}日`;
        }
    } else if (type === 'TIME_APPEND') {
        let currentTxt = txtInput.value.trim();
        if (currentTxt.includes("日")) {
            let datePart = currentTxt.split("日")[0] + "日";
            txtInput.value = `${datePart} ${picker.value}`;

    }

function checkNotificationTimers() {
    let now = new Date();
    let currentY = now.getFullYear();
    let currentM = String(now.getMonth() + 1).padStart(2, '0');
    let currentD = String(now.getDate()).padStart(2, '0');
    let todayStr = `${currentY}-${currentM}-${currentD}`;
    let currentHH = String(now.getHours()).padStart(2, '0');
    let currentMM = String(now.getMinutes()).padStart(2, '0');
    let timeHHMM = `${currentHH}:${currentMM}`; 

    let dismissedAlerts = JSON.parse(localStorage.getItem('dismissed_whatsapp_alerts')) || {};
    activities.forEach(ev => {
        if (dismissedAlerts[ev.id] === todayStr) return;

        let isTimeMatch = false;
        let notifyRaw = ev.notifyTime ? ev.notifyTime.trim() : "";

        if (!notifyRaw) return;

        if (ev.date === todayStr && notifyRaw.includes(":")) {
            let match = notifyRaw.match(/([0-1]?[0-9]|2[0-3]):[0-5][0-9]/);
            if (match && match[0]) {
                let parts = match[0].split(':');
                let formattedNotifyTime = `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                if (formattedNotifyTime === timeHHMM) {
                    isTimeMatch = true;
                }
            }
        }
        
        if (notifyRaw.includes("月") && notifyRaw.includes("日") && notifyRaw.includes(":")) {
            let monthLabel = parseInt(currentM) + "月";
            let dateLabel = parseInt(currentD) + "日";
            if (notifyRaw.includes(monthLabel) && notifyRaw.includes(dateLabel)) {
                let match = notifyRaw.match(/([0-1]?[0-9]|2[0-3]):[0-5][0-9]/);
                if (match && match[0]) {
                    let parts = match[0].split(':');
                    let formattedNotifyTime = `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                    if (formattedNotifyTime === timeHHMM) {
                        isTimeMatch = true;
                    }
                }
            }
        }

        if (isTimeMatch) {
            showAlertPopup(ev, todayStr);
        }
    });
}

    let msgHtml = `

function getLunar(date){
    try {
        let d = new Date(date);
        if (isNaN(d.getTime())) return "";
        let parts = new Intl.DateTimeFormat("zh-Hant-u-ca-chinese", {month:"numeric", day:"numeric"}).formatToParts(d);
        let month = parts.find(p=>p.type==='month').value; let day = parts.find(p=>p.type==='day').value;
        const CN=["","一","二","三","四","五","六","七","八","九","十"];
        function dCN(n){ n=Number(n); if(n<=10) return "初"+CN[n]; if(n<20) return "十"+CN[n-10]; if(n==20) return "二十"; if(n<30) return "廿"+CN[n-20]; return "三十";
        }
        function mCN(n){ return ["","一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","臘月"][n];
        }
        return day==1 ? mCN(month) : dCN(day);
    } catch(e) { return "";
    }
}

    let participants = ev.members && ev.members.length > 0 ? ev.members.join('、') : "全體成員";

    let textMessage = `💡【麟李互助家庭日誌 - 行程提醒】\n\n📢 有一項最新日程提醒：\n\n📅 日期：${ev.date}\n⏰ 活動時間：${ev.time}\n👥 活動參與者：${participants}\n📌 項目名稱 / 地點：${ev.title}${remark}\n\n🔔 提醒發送設定為：${ev.notifyTime}，請大家留意安排，互相照顧扶持！❤️`;
    let cleanPhone = ev.targetPhone ? ev.targetPhone.replace(/\s+/g, '') : "";
    if (cleanPhone) {
        if (cleanPhone.length === 8 && /^[569]/.test(cleanPhone)) {
            cleanPhone = "852" + cleanPhone;
        }

    let whatsappUrl = cleanPhone ?
    `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(textMessage)}` : 
    `https://api.whatsapp.com/send?text=${encodeURIComponent(textMessage)}`;
    window.open(whatsappUrl, '_blank');
}

    let targetPhoneInput = document.getElementById('targetPhone');
    let noteInput = document.getElementById('eventNote');
    let whatsappBtnTextInput = document.getElementById('whatsappBtnText');
    let editKey = document.getElementById('editKey').value;
    if (!titleInput.value.trim()) {
        alert("請輸入活動名稱或地點！");
        return;
    }

    let checkedMembers = [];
    let checkboxes = document.querySelectorAll('input[name="members"]:checked');
    checkboxes.forEach(cb => { checkedMembers.push(cb.value); });
    
    let eventData = {
        date: selectedDateStr,
        time: timeInput.value.trim() || "18:00",
        notifyTime: notifyTimeInput.value.trim() || "17:00", 
        title: titleInput.value.trim(),
        members: checkedMembers, 
        targetPhone: targetPhoneInput.value.trim(), 
        slotsSnapshot: slotsMapping, 
        whatsappBtnText: whatsappBtnTextInput.value.trim() || "💬 WhatsApp 通知", 
        note: noteInput.value.trim()
    };
    let targetURL = editKey ? `${dbURL}/${editKey}.json` : `${dbURL}.json`;
    let reqMethod = editKey ? "PUT" : "POST";
    fetch(targetURL, {
        method: reqMethod,
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(eventData)
    })
    .then(response => response.json())
    .then(() => {
        closeEventPopup(); 
        fetchCloudData();
    })
    .catch(err => {
        alert("儲存未成功，請確認 Firebase Rules 規則。");
        console.error(err);
    });
}

function deleteEventFromPopup(id) {
    if (confirm("確定要刪除這項活動嗎？")) {
        fetch(`${dbURL}/${id}.json`, { method: "DELETE", mode: "cors" })
            .then(() => { fetchCloudData(); });
    }
}

/* 渲染日曆 */
function renderCalendar(){
    let y = current.getFullYear(); let m = current.getMonth();
    monthLabel.innerText = y + "年 " + (m + 1) + "月";
    let first = new Date(y, m, 1).getDay();
    let days = new Date(y, m + 1, 0).getDate();
    let html = "", total = 0;
    for(let i=0; i<first; i++){ html += `<div class="calendar-day empty"></div>`; total++;
    }

    for(let i=1; i<=days; i++){
        let dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        let isToday = new Date().toISOString().slice(0,10) === dStr;
        let isSelected = selectedDateStr === dStr;
        let lunar = getLunar(dStr);
        let holiday = getDynamicHoliday(y, m+1, i);
        
        let dayActivities = activities.filter(a => a.date === dStr);
        dayActivities.sort((a, b) => a.time.localeCompare(b.time));
        let eventsHtml = "";
        
        dayActivities.forEach(act => {
            if (currentGlobalMode === "詳細資料") {
                let pTxt = act.members && act.members.length > 0 ? `(${act.members.join(',')})` : "";
                eventsHtml += `<span class="day-event-badge" style="background:#e8f9ed; color:#25D366; border-left-color:#25D366;" title="${act.title}">${act.time} ${pTxt} ${act.title}</span>`;
            } else {
                eventsHtml += `<span class="day-event-badge" title="${act.time} ${act.title}">${act.time} ${act.title}</span>`;
            }
        });
        
        let dayClass = "calendar-day";
        if (isToday) dayClass += " today";
        if (isSelected) dayClass += " selected-day";
        html += `
        <div class="${dayClass}" data-date="${dStr}" onclick="selectDate('${dStr}')">
            <strong>${i}</strong>
            <div class="lunar">${lunar}</div>
            ${holiday ? `<div class="holiday">🔴 ${holiday}</div>` : ""}
            <div class="day-events-container">${eventsHtml}</div>
        </div>
        `;
        total++;
    }
    while(total % 7 !== 0){ html += `<div class="calendar-day empty"></div>`; total++;
    }
    calendar.innerHTML = html;
}

function changeMonth(n){ current.setMonth(current.getMonth() + n); renderCalendar(); }
