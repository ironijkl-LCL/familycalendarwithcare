<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麟李互助家庭日誌</title>

<style>
body { font-family: Arial, sans-serif; margin:0; font-size:18px; background:#f5f5f5; }

header {
    background:#25D366;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container { padding:10px; }

/* ─── 🛠️ 核心樣式優化：頂部操作按鈕全面改為 5 鍵平排 ─── */
.top-action-card {
    background: white;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: row; 
    gap: 6px;
    width: 100%;
    box-sizing: border-box;
}

/* 讓 5 個按鈕在 row 佈局下公平等分寬度 */
.top-action-card button.action-btn {
    flex: 1;
    margin: 0 !important; 
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* 窄螢幕防禦 */
@media (max-width: 650px) {
    .top-action-card {
        flex-wrap: wrap;
        gap: 6px;
    }
    .top-action-card button.action-btn {
        flex: 1 1 calc(33.33% - 6px); 
        font-size: 14px !important;
        padding: 10px 4px !important;
    }
}

.card {
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.calendar-header {
    display: flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 15px;
}

.nav-btn {
    width:25%;
    padding:10px;
    font-size:16px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.month-title {
    font-size:22px;
    font-weight:bold;
}

.weekdays-container {
    display: flex;
    width: 100%;
    margin-bottom: 5px;
}

.weekday {
    flex: 1;
    text-align:center;
    color:gray;
    font-weight:bold;
    font-size:16px;
}

.calendar { 
    font-size:0; 
    display: flex;
    flex-wrap: wrap;
    width: 100%;
}

.calendar-day {
    display: inline-block;
    width: 14.2857%;
    padding:6px 2px;
    text-align:center;
    background:white;
    border-radius:10px;
    margin-bottom:6px;
    min-height:110px;
    font-size:18px;
    vertical-align: top;
    box-sizing: border-box;
    cursor: pointer;
    border: 1px solid #f0f0f0;
    overflow: hidden;
    position: relative;
}

.calendar-day:hover {
    background: #e8f9ed;
}

.empty { 
    background:transparent; 
    border: none;
    cursor: default;
}

.today { border:3px solid orange; }
.selected-day { background: #d0f5db !important; border: 2px solid #25D366; }

.multiday-pass-range {
    background: rgba(37, 211, 102, 0.12) !important;
}

.lunar {
    font-size:12px;
    color:#666;
    margin-top: 2px;
}

.holiday {
    font-size:11px;
    color:red;
    font-weight:bold;
    margin-top: 2px;
    line-height: 1.2;
}

.day-event-badge {
    font-size: 11px;
    background: #e6f7ff;
    color: #1890ff;
    border-left: 3px solid #1890ff;
    padding: 2px 4px;
    margin-top: 3px;
    text-align: left;
    border-radius: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
}

button.action-btn {
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button.action-btn:hover { background:#20ba59; }
button.delete-btn { background:#ff4d4f; padding:6px 12px; color:white; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
button.edit-btn { background:#1890ff; padding:6px 12px; color:white; border:none; border-radius:6px; font-size:14px; cursor:pointer; margin-right: 5px; }
button.whatsapp-btn { background:#25D366; padding:6px 12px; color:white; border:none; border-radius:6px; font-size:14px; cursor:pointer; font-weight: bold; }

input, textarea {
    width:100%;
    padding:12px;
    margin:6px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px;
}

.event-item {
    background: #f9f9f9;
    padding: 12px;
    border-left: 4px solid #25D366;
    margin-bottom: 8px;
    border-radius: 0 8px 8px 0;
    font-size: 16px;
    overflow: hidden;
}

.event-time { font-weight: bold; color: #333; }
.event-desc { margin-top: 4px; color: #555; }

.event-image-preview-box {
    margin-top: 8px;
    max-width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e0e0e0;
    display: inline-block;
}
.event-image-preview-box img { max-height: 140px; display: block; object-fit: contain; }

.member-checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 8px 0 14px 0;
    background: #f9f9f9;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #e0e0e0;
}
.member-label {
    font-size: 15px;
    display: flex;
    align-items: center;
    cursor: pointer;
    background: white;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #ddd;
}
.member-label input[type="checkbox"] { width: auto; margin: 0 6px 0 0; transform: scale(1.3); }
.btn-text-span { color: #333; font-weight: 500; display: inline-block; }
.phone-indicator { font-size: 11px; color: #1890ff; margin-left: 3px; }

.twin-input-wrapper { display: flex; align-items: center; position: relative; width: 100%; }
.twin-input-wrapper input[type="text"] { flex: 1; cursor: pointer; }
.wheel-trigger-box { position: absolute; right: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: flex-end; pointer-events: none; }
.wheel-btn { background: transparent !important; border: none !important; width: 100%; height: 100%; position: relative; pointer-events: auto; }
.picker-overlay-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0 !important; cursor: pointer; z-index: 5; }

.time-picker-label { font-size: 15px; color: #555; margin-top: 10px; display: block; font-weight: bold; }

.popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); z-index: 1000; overflow-y: auto; }
.popup-content-card { position: relative; background: white; width: 90%; max-width: 550px; margin: 50px auto; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); animation: popupSlideIn 0.3s ease-out; }
.popup-close-x { position: absolute; top: 15px; right: 18px; font-size: 24px; color: #8c8c8c; cursor: pointer; font-weight: bold; }

@keyframes popupSlideIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.password-lock-section { background: #fffbe6; border: 1px solid #ffe58f; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: center; }
.secure-form-fields { display: none; margin-top: 15px; }
.manage-item-row { background: #f5f5f5; padding: 10px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

/* 視圖切換 */
.view-精簡 .day-event-badge { display: none !important; }
.view-疊放 .day-event-badge { padding: 1px 2px !important; margin-top: 1px !important; font-size: 10px !important; line-height: 1.1 !important; }
.view-詳細資料 .calendar-day { min-height: 140px !important; }
.view-詳細資料 .day-event-badge { white-space: normal !important; word-break: break-all !important; overflow: visible !important; }
.view-option-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
.view-radio-label { display: flex; align-items: center; background: #f5f5f5; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.view-radio-label input { width: auto; margin: 0 10px 0 0; transform: scale(1.3); }
</style>
</head>

<body class="view-列表" id="bodyNode">

<header>📅 麟李互助家庭日誌</header>

<div class="container">

    <!-- 頂部 5 鍵平排按鈕 -->
    <div class="top-action-card">
        <button class="action-btn" style="background: #25D366; font-size: 15px; padding: 12px 6px;" onclick="openAddFormPopup('ADD')">➕ 活動</button>
        <button class="action-btn" style="background: #1890ff; font-size: 15px; padding: 12px 6px;" onclick="openAddFormPopup('MANAGE')">⚙️ 管理</button>
        <button class="action-btn" style="background: #f39c12; font-size: 15px; padding: 12px 6px;" onclick="fetchCloudData()">🏡 麟李</button>
        <button class="action-btn" style="background: #00c642; font-size: 15px; padding: 12px 6px;" onclick="openAddFormPopup('WHATSAPP')">💬 WHATSAPP</button>
        <button class="action-btn" style="background: #722ed1; font-size: 15px; padding: 12px 6px;" onclick="openAddFormPopup('SWITCH_VIEW')">👁️ 視覺</button>
    </div>

    <div class="card">
        <div class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)">⬅ 上一月</button>
            <div id="monthLabel" class="month-title"></div>
            <button class="nav-btn" onclick="changeMonth(1)">下一月 ➡</button>
        </div>

        <div class="weekdays-container">
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
        </div>

        <div id="calendar" class="calendar"></div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; color:#333;">📋 <span id="selectedDateLabel"></span> 活動日程</h3>
        <div id="dayEvents"></div>
    </div>

    <!-- 核心功能彈窗 -->
    <div class="popup-overlay" id="addEventPopupOverlay" onclick="closePopupOverlayOutside(event)">
        <div class="popup-content-card" id="popupInnerCard">
            <span class="popup-close-x" onclick="closeEventPopup()">&times;</span>
            <h3 id="formTitle" style="margin-top:0; color:#333;">➕ 新增家庭活動</h3>
            <input type="hidden" id="editKey" value="">

            <div class="password-lock-section" id="lockSection">
                <div style="display:flex; gap:8px;">
                    <input type="password" id="popupPassword" placeholder="輸入密碼進入..." style="margin:0; flex:1; padding:10px;">
                    <button type="button" class="action-btn" style="margin:0; width:auto; padding:10px 20px; background:#1890ff;" onclick="verifyGatePassword()">確認進入</button>
                </div>
            </div>

            <div class="secure-form-fields" id="secureFormPanel">
                <label for="eventTitle" style="font-size:15px; color:#666; display: block;">活動名稱 / 地點：</label>
                <input type="text" id="eventTitle" placeholder="例如：陪爺爺飲茶、家族聚餐">

                <label class="time-picker-label" for="eventTime">📅 開始時間與日期：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="eventTime" value="" placeholder="點擊選取開始日期時間" onclick="document.getElementById('startPickerNode').showPicker()">
                    <div class="wheel-trigger-box"><div class="wheel-btn"><input type="datetime-local" id="startPickerNode" class="picker-overlay-input" onchange="syncComboPicker(this, 'eventTime', 'START')"></div></div>
                </div>

                <label class="time-picker-label" for="eventEndTime">📆 結束時間與日期：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="eventEndTime" placeholder="點擊選取結束日期時間 (選填)" onclick="document.getElementById('endPickerNode').showPicker()">
                    <div class="wheel-trigger-box"><div class="wheel-btn"><input type="datetime-local" id="endPickerNode" class="picker-overlay-input" onchange="syncComboPicker(this, 'eventEndTime', 'END')"></div></div>
                </div>

                <label class="time-picker-label" for="notifyTime">🔔 WhatsApp 提醒時間：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="notifyTime" value="" placeholder="點擊選取提醒時間" onclick="document.getElementById('notifyPickerNode').showPicker()">
                    <div class="wheel-trigger-box"><div class="wheel-btn"><input type="datetime-local" id="notifyPickerNode" class="picker-overlay-input" onchange="syncComboPicker(this, 'notifyTime', 'NOTIFY')"></div></div>
                </div>

                <label for="eventImageUrl" style="font-size:15px; color:#1890ff; display: block; margin-top:12px; font-weight: bold;">🖼️ 附圖網址：</label>
                <input type="text" id="eventImageUrl" placeholder="請貼上圖片網址">

                <label style="font-size:15px; color:#666; display: block; margin-top: 12px;">活動參與者：</label>
                <div class="member-checkbox-group" id="memberCheckboxContainer">
                    <label class="member-label" id="slot_label_1"><input type="checkbox" name="members" id="slot_cb_1" value="阿鐵" onclick="syncTargetPhone(1)"> <span class="btn-text-span" onclick="modifyMemberPrompt(1, event)">阿鐵</span></label>
                    <label class="member-label" id="slot_label_2"><input type="checkbox" name="members" id="slot_cb_2" value="Jolie" onclick="syncTargetPhone(2)"> <span class="btn-text-span" onclick="modifyMemberPrompt(2, event)">Jolie</span></label>
                    <label class="member-label" id="slot_label_3"><input type="checkbox" name="members" id="slot_cb_3" value="Daddy" onclick="syncTargetPhone(3)"> <span class="btn-text-span" onclick="modifyMemberPrompt(3, event)">Daddy</span></label>
                    <label class="member-label" id="slot_label_4"><input type="checkbox" name="members" id="slot_cb_4" value="Mummy" onclick="syncTargetPhone(4)"> <span class="btn-text-span" onclick="modifyMemberPrompt(4, event)">Mummy</span></label>
                </div>

                <label for="targetPhone" style="font-size:15px; color:#666; display: block;">接收者電話：</label>
                <input type="tel" id="targetPhone" placeholder="留空則發送到大群組">

                <label for="eventNote" style="font-size:15px; color:#666; display: block;">備註：</label>
                <textarea id="eventNote" rows="2" placeholder="詳細備忘..."></textarea>
                
                <button id="submitBtn" class="action-btn" style="background:#25D366; margin-top: 15px;" onclick="addFamilyEvent()">儲存至此日期</button>
            </div>

            <div class="secure-form-fields" id="secureManagePanel"><div id="popupManageList"></div></div>
            <div class="secure-form-fields" id="secureWhatsAppPanel"><div id="popupWhatsAppList"></div></div>
            <div class="secure-form-fields" id="secureViewSwitchPanel">
                <div class="view-option-group">
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="精簡" onclick="changeGlobalViewMode('精簡')"> ▤ 精簡</label>
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="疊放" onclick="changeGlobalViewMode('疊放')"> ⪢ 疊放</label>
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="詳細資料" onclick="changeGlobalViewMode('詳細資料')"> 📋 詳細資料</label>
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="列表" onclick="changeGlobalViewMode('列表')"> ✓ ☰ 列表</label>
                </div>
            </div>
            <button id="cancelBtn" class="action-btn" style="background:#8c8c8c; margin-top:15px;" onclick="closeEventPopup()">關閉面板</button>
        </div>
    </div>

    <!-- 成員修改彈窗 -->
    <div class="popup-overlay" id="memberEditPopupOverlay" onclick="closeMemberPopupOverlayOutside(event)">
        <div class="popup-content-card" style="max-width: 450px; margin: 100px auto;">
            <span class="popup-close-x" onclick="closeMemberEditPopup()">&times;</span>
            <h3 id="memberFormTitle">✏️ 修改成員資料</h3>
            <div class="password-lock-section" id="memberLockSection">
                <div style="display:flex; gap:8px;">
                    <input type="password" id="memberPopupPassword" placeholder="輸入密碼..." style="margin:0; flex:1; padding:10px;">
                    <button type="button" class="action-btn" style="margin:0; width:auto; background:#1890ff;" onclick="verifyMemberGatePassword()">確認</button>
                </div>
            </div>
            <div class="secure-form-fields" id="secureMemberPanel">
                <input type="hidden" id="currentEditSlotId" value="">
                <label>參與者顯示名稱：</label><input type="text" id="editMemberName">
                <label>WhatsApp 電話：</label><input type="tel" id="editMemberPhone">
                <button class="action-btn" style="background:#25D366; margin-top: 20px;" onclick="saveMemberSettings()">儲存更新</button>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div class="popup-overlay" id="whatsappAlertPopupOverlay">
        <div class="popup-content-card" style="max-width: 460px; margin: 120px auto; border: 3px solid #25D366; text-align: center;">
            <h3 style="color:#25D366;">⏰ WhatsApp 提醒時間到了！</h3>
            <div id="whatsappAlertMessage" style="text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px;"></div>
            <input type="hidden" id="currentAlertEventId" value="">
            <button class="action-btn" style="background:#25D366;" onclick="triggerAlertWhatsAppSend()">💬 立即傳送</button>
            <button class="action-btn" style="background:#8c8c8c;" onclick="dismissAlertPopup()">稍後處理</button>
        </div>
    </div>

</div>

<script>
// 精確對接全新真實 Firebase 專案路徑
const dbURL = "https://familycalender-a62ae-default-rtdb.firebaseio.com/family_calendar_activities";

let activities = [];
let current = new Date();
current.setMonth(5); // 預設直接切換至 6 月份，方便立刻看見行程！
let selectedDateStr = "2026-06-01"; 

let currentGlobalMode = localStorage.getItem('family_日誌_view_mode') || "列表";
let slotsMapping = JSON.parse(localStorage.getItem('member_slots_extended_config')) || {
    1: { name: "阿鐵", phone: "" }, 2: { name: "Jolie", phone: "" }, 3: { name: "Daddy", phone: "" }, 4: { name: "Mummy", phone: "" }
};

function changeGlobalViewMode(modeStr) {
    currentGlobalMode = modeStr;
    localStorage.setItem('family_日誌_view_mode', modeStr);
    document.getElementById('bodyNode').className = `view-${modeStr}`;
    renderCalendar();
    closeEventPopup();
}

function syncComboPicker(inputElement, txtInputId, flag) {
    let txtInput = document.getElementById(txtInputId);
    if (!inputElement || !inputElement.value || !txtInput) return;
    let parts = inputElement.value.split('T');
    let d = new Date(parts[0]);
    if (!isNaN(d.getTime())) {
        txtInput.value = `${d.getMonth() + 1}月${d.getDate()}日 ${parts[1]}`;
        txtInput.setAttribute('data-raw-date', parts[0]);
        txtInput.setAttribute('data-raw-time', parts[1]);
    }
}

function verifyGatePassword() {
    if (document.getElementById('popupPassword').value === "8679") {
        document.getElementById('lockSection').style.display = 'none';
        if (currentPopupMode === "MANAGE") { document.getElementById('secureManagePanel').style.display = 'block'; renderPopupManageListUI(); }
        else if (currentPopupMode === "WHATSAPP") { document.getElementById('secureWhatsAppPanel').style.display = 'block'; renderPopupWhatsApp_UI(); }
        else { document.getElementById('secureFormPanel').style.display = 'block'; }
    } else { alert("❌ 密碼錯誤！"); }
}

function verifyMemberGatePassword() {
    if (document.getElementById('memberPopupPassword').value === "8679") {
        document.getElementById('memberLockSection').style.display = 'none';
        document.getElementById('secureMemberPanel').style.display = 'block';
    } else { alert("❌ 密碼錯誤！"); }
}

function openAddFormPopup(mode) {
    currentPopupMode = mode || "ADD";
    document.getElementById('lockSection').style.display = 'block';
    document.getElementById('secureFormPanel').style.display = 'none';
    document.getElementById('secureManagePanel').style.display = 'none';
    document.getElementById('secureWhatsAppPanel').style.display = 'none';
    document.getElementById('secureViewSwitchPanel').style.display = 'none';

    if (currentPopupMode === "SWITCH_VIEW") {
        document.getElementById('lockSection').style.display = 'none';
        document.getElementById('secureViewSwitchPanel').style.display = 'block';
    }
    document.getElementById('addEventPopupOverlay').style.display = 'block';
}

function closeEventPopup() { document.getElementById('addEventPopupOverlay').style.display = 'none'; }
function closePopupOverlayOutside(e) { if (e.target === document.getElementById('addEventPopupOverlay')) closeEventPopup(); }

/* ─── 📦 智慧型自動大批量行程初始化導入引擎 ─── */
function autoCheckAndInjectJuneEvents() {
    // 比對是否有 6 月份的核心數據，防止重疊寫入
    let hasJuneData = activities.some(a => a.date && a.date.startsWith("2026-06"));
    if (hasJuneData) return; 

    console.log("偵測到新資料庫完全空白，啟動 6 月份全行程自動雲端同步機制...");

    const junePayloads = [
        // 第一週
        { date: "2026-06-01", time: "08:30", title: "蓓 8:30 放學", isMultiDayEvent: true, multiDayRangeArray: ["2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04"], note: "劃橫線特別安排週" },
        { date: "2026-06-02", time: "19:15 / 21:45", title: "蓓 7:15pm 放學 / 熹 9:45pm 放學", note: "" },
        { date: "2026-06-03", time: "11:15", title: "蓓 11:15 放學 / 熹 放假", note: "" },
        { date: "2026-06-04", time: "09:25", title: "蓓 放假 / 熹 9:25 放學", note: "當日圈字：Cynthia / Comfort" },
        { date: "2026-06-05", time: "11:15 / 21:45", title: "蓓 11:15 放學 / 熹 9:45 放學", note: "" },
        
        // 第二週

function fetchCloudData() {
    fetch(`${dbURL}.json`, { method: "GET", mode: "cors" })
        .then(res => res.json())
        .then(data => {
            activities = [];
            if (data) {
                for (let key in data) {
                    if (data[key]) {
                        activities.push({
                            id: key,
                            date: data[key].date ? data[key].date.trim() : "",
                            time: data[key].time || "18:00",
                            title: data[key].title || "行程",
                            note: data[key].note || "",
                            isMultiDayEvent: data[key].isMultiDayEvent || false,
                            multiDayRangeArray: data[key].multiDayRangeArray || []
                        });
                    }
                }
            }
            renderCalendar();
            renderDayEvents();
            autoCheckAndInjectJuneEvents(); // 智慧安全檢查
        });
}

setInterval(fetchCloudData, 5000);

function renderCalendar(){
    let y = current.getFullYear(); let m = current.getMonth();
    monthLabel.innerText = y + "年 " + (m + 1) + "月";
    let first = new Date(y, m, 1).getDay();
    let days = new Date(y, m + 1, 0).getDate();
    let html = "", total = 0;
    
    for(let i=0; i<first; i++){ html += `<div class="calendar-day empty"></div>`; total++; }

    for(let i=1; i<=days; i++){
        let dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        let isToday = new Date().toISOString().slice(0,10) === dStr;
        let isSelected = selectedDateStr === dStr;
        
        let dayActivities = activities.filter(a => {
            if (a.isMultiDayEvent && a.multiDayRangeArray) { return a.multiDayRangeArray.includes(dStr); }
            return a.date === dStr;
        });

        let belongsToMultiDay = activities.some(act => act.isMultiDayEvent && act.multiDayRangeArray && act.multiDayRangeArray.includes(dStr));
        let eventsHtml = "";
        dayActivities.forEach(act => {
            eventsHtml += `<span class="day-event-badge" title="${act.title}">${act.time} ${act.title}</span>`;
        });
        
        let dayClass = "calendar-day";
        if (isToday) dayClass += " today";
        if (isSelected) dayClass += " selected-day";
        if (belongsToMultiDay) dayClass += " multiday-pass-range";

        html += `
        <div class="${dayClass}" data-date="${dStr}" onclick="selectDate('${dStr}')">
            <strong>${i}</strong>
            <div class="day-events-container">${eventsHtml}</div>
        </div>
        `;
        total++;
    }
    while(total % 7 !== 0){ html += `<div class="calendar-day empty"></div>`; total++; }
    calendar.innerHTML = html;
}

function selectDate(dateStr) {
    selectedDateStr = dateStr;
    renderCalendar();
    renderDayEvents();
}

function renderDayEvents() {
    let container = document.getElementById('dayEvents');
    let filtered = activities.filter(a => {
        if (a.isMultiDayEvent && a.multiDayRangeArray) { return a.multiDayRangeArray.includes(selectedDateStr); }
        return a.date === selectedDateStr;
    });
    
    document.getElementById('selectedDateLabel').innerText = selectedDateStr;
    if (filtered.length === 0) {
        container.innerHTML = `<p style="color:gray; text-align:center; padding:20px 0;">今日無 any 排定活動，大家可以輕鬆享受樂活時光！</p>`;
        return;
    }
    
    let html = "";
    filtered.forEach(ev => {
        html += `
        <div class="event-item">
            <div class="event-time">⏰ 時間：${ev.time}</div>
            <div class="event-desc">📌 項目：<strong>${ev.title}</strong></div>
            ${ev.note ? `<div class="event-desc" style="color:gray;">📝 備忘筆記：${ev.note}</div>` : ""}
        </div>`;
    });
    container.innerHTML = html;
}

function changeMonth(dir) {
    current.setMonth(current.getMonth() + dir);
    renderCalendar();
}
