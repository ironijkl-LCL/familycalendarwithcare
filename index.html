<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0071e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="麟李家庭智慧管理系統 - 結合 Dify AI 雲端分類、真 E2EE 加密與即時同步日曆">
<title>Family OS - 麟李家庭智慧管理系統</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- DOMPurify 防禦 XSS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/dompurify.min.js"></script>

<style>
:root {
    --apple-bg: #f5f5f7;
    --apple-card: rgba(255, 255, 255, 0.92);
    --apple-text: #1d1d1f;
    --apple-text-secondary: #48484a;
    --apple-border: rgba(0, 0, 0, 0.08);
    --apple-glow-border: rgba(255, 255, 255, 0.7);
    --oasis-primary: #0071e3;
    --oasis-primary-glow: rgba(0, 113, 227, 0.15);
    --oasis-success: #34c759;
    --oasis-warning: #c97500;
    --oasis-danger: #d70015;
    --oasis-ai-gradient: linear-gradient(135deg, rgba(232, 220, 255, 0.55), rgba(212, 235, 255, 0.55));
    --oasis-ai-purple: #7d2ae8;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    font-size: 17px;
    background-color: var(--apple-bg);
    color: var(--apple-text);
    padding-bottom: calc(100px + env(safe-area-inset-bottom));
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

input, textarea, select {
    font-size: 16px !important;
}

header {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--apple-text);
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: 12px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--apple-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.header-status-group { display: flex; align-items: center; gap: 8px; }

.auth-badge {
    font-size: 13px !important;
    background: rgba(0,0,0,0.06);
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 600;
    color: var(--apple-text-secondary);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    border: none;
}

.e2ee-badge {
    font-size: 12px !important;
    background: rgba(125, 42, 232, 0.1);
    color: var(--oasis-ai-purple);
    padding: 6px 10px;
    border-radius: 20px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(125, 42, 232, 0.25);
}

.logout-link {
    font-size: 13px;
    color: var(--oasis-danger);
    text-decoration: underline;
    cursor: pointer;
    display: none;
    font-weight: 600;
}

.container { padding: 16px; max-width: 1140px; margin: 0 auto; box-sizing: border-box; }

.toast-notice {
    position: fixed;
    top: calc(12px + max(16px, env(safe-area-inset-top)));
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(29, 29, 31, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    z-index: 9999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}
.toast-notice.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-notice.error { background: rgba(215, 0, 21, 0.95); }
.toast-notice.success { background: rgba(40, 167, 69, 0.95); }

.card {
    background: var(--apple-card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    border: 1px solid var(--apple-glow-border);
    box-sizing: border-box;
}

.top-action-card {
    background: var(--apple-card);
    padding: 10px;
    margin-bottom: 18px;
    border-radius: 16px;
    display: flex;
    flex-direction: row;
    gap: 8px;
    border: 1px solid var(--apple-glow-border);
}
.top-action-card button.action-btn {
    flex: 1;
    margin: 0 !important;
    white-space: nowrap;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px !important;
    padding: 12px 6px;
    font-weight: 600;
    cursor: pointer;
}

.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.nav-btn {
    padding: 8px 14px;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.06);
    color: var(--apple-text);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}
.month-title { font-size: 20px; font-weight: 700; }

.weekdays-container {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    width: 100%;
    margin-bottom: 6px;
}
.weekday {
    text-align: center;
    color: var(--apple-text-secondary);
    font-weight: 700;
    font-size: 13px;
    padding: 4px 0;
}
.weekdays-container .weekday:first-child { color: var(--oasis-danger); }

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    width: 100%;
    touch-action: pan-y;
}
.calendar-day {
    display: flex;
    flex-direction: column;
    padding: 6px 4px;
    text-align: center;
    background: #ffffff;
    border-radius: 12px;
    min-height: 110px;
    font-size: 15px;
    box-sizing: border-box;
    cursor: pointer;
    border: 1px solid rgba(0,0,0,0.06);
    position: relative;
}
.calendar-day.empty { background: transparent !important; border-color: transparent !important; pointer-events: none; }
.calendar-day.today { border: 2px solid var(--oasis-warning) !important; background: rgba(201, 117, 0, 0.05); }
.calendar-day.selected-day { background: #eafff1 !important; border: 2px solid var(--oasis-success) !important; }

.day-events-container { margin-top: 4px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.day-event-badge {
    font-size: 11px;
    padding: 3px 5px;
    text-align: left;
    border-radius: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    font-weight: 600;
}

.floating-add-btn {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    right: max(20px, env(safe-area-inset-right));
    width: 56px;
    height: 56px;
    background: var(--oasis-primary);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 28px;
    box-shadow: 0 8px 24px rgba(0, 113, 227, 0.35);
    cursor: pointer;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
}

.popup-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 2000;
    overflow-y: auto;
}
.popup-content-card {
    position: relative;
    background: #ffffff;
    width: 92%;
    max-width: 520px;
    margin: calc(24px + max(16px, env(safe-area-inset-top))) auto calc(40px + env(safe-area-inset-bottom)) auto;
    padding: 24px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    box-sizing: border-box;
}
.popup-close-x { position: absolute; top: 18px; right: 20px; font-size: 24px; color: var(--apple-text-secondary); cursor: pointer; border: none; background: transparent; }
.password-lock-section { background: rgba(0,0,0,0.03); padding: 16px; border-radius: 14px; margin-top: 12px; }
.secure-form-fields { display: none; margin-top: 16px; }

button.action-btn-block {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    background: var(--oasis-primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}
button.action-btn-block:disabled { opacity: 0.6; }

/* 🍏 Apple HIG 規範專用自訂 Modal (完全取代 alert / confirm / prompt) */
.hig-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10000;
    justify-content: center;
    align-items: center;
}
.hig-modal-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    width: 275px;
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.2);
    overflow: hidden;
    text-align: center;
    animation: higPop 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes higPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.hig-modal-header { padding: 18px 16px 12px; }
.hig-modal-title { font-size: 17px; font-weight: 600; color: var(--apple-text); margin: 0; }
.hig-modal-message { font-size: 13px; color: var(--apple-text-secondary); margin-top: 6px; line-height: 1.4; }
.hig-modal-input {
    width: 88%;
    margin: 8px auto 14px;
    padding: 6px 10px;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 6px;
    box-sizing: border-box;
    display: block;
    background: #ffffff;
}
.hig-modal-actions {
    display: flex;
    border-top: 1px solid rgba(0,0,0,0.1);
}
.hig-modal-btn {
    flex: 1;
    background: transparent;
    border: none;
    padding: 12px 0;
    font-size: 16px;
    color: var(--oasis-primary);
    cursor: pointer;
}
.hig-modal-btn.cancel {
    border-right: 1px solid rgba(0,0,0,0.1);
    font-weight: 400;
    color: var(--apple-text-secondary);
}
.hig-modal-btn.destructive { color: var(--oasis-danger); font-weight: 600; }
.hig-modal-btn.primary { font-weight: 600; }
</style>

<!-- Firebase SDK 模組 (App Check + Auth + RTDB) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
  import { 
    initializeAuth, 
    browserLocalPersistence, 
    inMemoryPersistence, 
    getAuth, 
    signInWithEmailAndPassword, 
    signOut, 
    deleteUser, 
    reauthenticateWithCredential, 
    EmailAuthProvider,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, onValue, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAasqW8TgacCLLNuhg_I1ItVQlDfAHatc0",
    authDomain: "familycalender-a62ae.firebaseapp.com",
    databaseURL: "https://familycalender-a62ae-default-rtdb.firebaseio.com",
    projectId: "familycalender-a62ae",
    storageBucket: "familycalender-a62ae.firebasestorage.app",
    messagingSenderId: "161867987572",
    appId: "1:161867987572:web:ee6641980baaf9cd78ef21",
    measurementId: "G-9ZSCC551ZJ"
  };

  const app = initializeApp(firebaseConfig);

  // 1. 本地開發、模擬器或 Capacitor 混合環境除錯權杖
  if (location.hostname === "localhost" || location.protocol === "capacitor:") {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
  }

  // 2. 啟動 Firebase App Check (reCAPTCHA Enterprise)
  try {
      initializeAppCheck(app, {
          provider: new ReCaptchaEnterpriseProvider('6LcD6cQtAAAAAB0OQG6JElGlxF3qbvlg_X8lr1Ln'),
          isTokenAutoRefreshEnabled: true
      });
      console.log("✓ Firebase App Check 已啟動");
  } catch (err) {
      console.warn("App Check 初始化略過:", err.message);
  }

  let auth;
  try {
      auth = initializeAuth(app, { persistence: [browserLocalPersistence, inMemoryPersistence] });
  } catch (e) {
      auth = getAuth(app);
  }

  const db = getDatabase(app);

  window.fbAuth = auth;
  window.fbSignIn = signInWithEmailAndPassword;
  window.fbSignOut = signOut;
  window.fbDeleteUser = deleteUser;
  window.fbReauth = reauthenticateWithCredential;
  window.fbEmailAuthProvider = EmailAuthProvider;
  window.fbDb = db;
  window.fbRef = ref;
  window.fbOnValue = onValue;
  window.fbSet = set;
  window.fbPush = push;
  window.fbUpdate = update;
  window.fbRemove = remove;

  // 3. 恢復 onAuthStateChanged 狀態監聽器 (修復 P0-5)
  onAuthStateChanged(auth, async (user) => {
      if (user) {
          const email = user.email || "";
          let matchedName = "鐵";
          if (email.includes("daddy")) matchedName = "Daddy";
          else if (email.includes("mummy")) matchedName = "Mummy";
          else if (email.includes("jolie")) matchedName = "Jolie";
          else if (email.includes("leisel")) matchedName = "蓓";
          else if (email.includes("karis")) matchedName = "熹";
          
          applyAdminState(matchedName);
          window.startFirebaseSync();
      } else {
          renderUnauthenticatedState();
      }
  });

  window.startFirebaseSync = function() {
      if (!window.fbDb || !window.fbRef || !window.fbOnValue) return;
      const activitiesRef = window.fbRef(window.fbDb, "family_calendar_activities");
      
      window.fbOnValue(activitiesRef, async (snapshot) => {
          const data = snapshot.val();
          const tempActivities = [];
          if (data) {
              for (let key in data) {
                  const item = data[key];
                  const decryptedTitle = await E2EE.decrypt(item.title);
                  tempActivities.push({
                      id: key,
                      date: item.date || "",
                      endDate: item.endDate || item.date || "",
                      time: item.time || "全日",
                      title: decryptedTitle || "行程",
                      assignee: item.assignee || "全員",
                      category: item.category || "家庭",
                      status: item.status || "待處理"
                  });
              }
          }
          if (tempActivities.length > 0) {
              activities = tempActivities;
              localStorage.setItem('family_cached_activities', JSON.stringify(activities));
              triggerPipelineRefresh();
          }
      }, (error) => {
          console.warn("RTDB 權限受限，維持離線快取:", error.code);
      });
  };
</script>

<body class="view-列表" id="bodyNode">

<div id="toastBar" class="toast-notice" role="status" aria-live="polite">✓ 雲端同步完成</div>

<header role="banner">
    <div style="font-weight: 700; font-size: 16px;">🏠 Family OS <span style="font-size: 12px; font-weight: normal; color: var(--apple-text-secondary);">v10.2 (HIG 規範版)</span></div>

        <button id="roleBadge" class="auth-badge" onclick="handleAuthBadgeClick()">🔒 訪客模式 (Viewer)</button>

</header>

<main class="container" role="main">

    <nav class="top-action-card">

// ─── 🍏 Apple HIG 自訂對話框系統 (修復 P0-3：徹底杜絕原生 alert / confirm / prompt) ───
const CustomDialog = {
    overlay: null,
    titleEl: null,
    msgEl: null,
    inputEl: null,
    actionsEl: null,

    init() {
        this.overlay = document.getElementById('higModalOverlay');
        this.titleEl = document.getElementById('higModalTitle');
        this.msgEl = document.getElementById('higModalMessage');
        this.inputEl = document.getElementById('higModalInput');
        this.actionsEl = document.getElementById('higModalActions');
    },

    alert(title, message) {
        return new Promise(resolve => {
            this.init();
            this.titleEl.innerText = title;
            this.msgEl.innerText = message;
            this.inputEl.style.display = 'none';
            this.actionsEl.innerHTML = `<button class="hig-modal-btn primary">確定</button>`;
            this.actionsEl.querySelector('button').onclick = () => {
                this.overlay.style.display = 'none';
                resolve();
            };
            this.overlay.style.display = 'flex';
        });
    },

    confirm(title, message, isDestructive = false) {
        return new Promise(resolve => {
            this.init();
            this.titleEl.innerText = title;
            this.msgEl.innerText = message;
            this.inputEl.style.display = 'none';
            this.actionsEl.innerHTML = `
                <button class="hig-modal-btn cancel">取消</button>
                <button class="hig-modal-btn ${isDestructive ? 'destructive' : 'primary'}">確認</button>
            `;
            this.actionsEl.querySelector('.cancel').onclick = () => {
                this.overlay.style.display = 'none';
                resolve(false);
            };
            this.actionsEl.querySelector(isDestructive ? '.destructive' : '.primary').onclick = () => {
                this.overlay.style.display = 'none';
                resolve(true);
            };
            this.overlay.style.display = 'flex';
        });
    },

    prompt(title, message, placeholder = "", isPassword = false) {
        return new Promise(resolve => {
            this.init();
            this.titleEl.innerText = title;
            this.msgEl.innerText = message;
            this.inputEl.style.display = 'block';
            this.inputEl.type = isPassword ? 'password' : 'text';
            this.inputEl.placeholder = placeholder;
            this.inputEl.value = "";
            this.actionsEl.innerHTML = `
                <button class="hig-modal-btn cancel">取消</button>
                <button class="hig-modal-btn primary">確定</button>
            `;
            this.actionsEl.querySelector('.cancel').onclick = () => {
                this.overlay.style.display = 'none';
                resolve(null);
            };
            this.actionsEl.querySelector('.primary').onclick = () => {
                const val = this.inputEl.value;
                this.overlay.style.display = 'none';
                resolve(val);
            };
            this.overlay.style.display = 'flex';
            setTimeout(() => this.inputEl.focus(), 150);
        });
    }
};

// ─── 🛡️ 真·E2EE 模組 (修復 P0-2：徹底移除寫死密鑰，改用家庭主保險庫金鑰) ───
const E2EE = {
    masterKey: null,
    FAMILY_SALT: new TextEncoder().encode("Lohas_FamilyOS_SecuredSalt_2026_HK"),

    async deriveKey(passphrase) {
        if (!passphrase) return null;
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey(
            "raw",
            enc.encode(passphrase),
            { name: "PBKDF2" },
            false,
            ["deriveKey"]
        );

        return await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: this.FAMILY_SALT,
                iterations: 100000,
                hash: "SHA-256"
            },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    },

    async unlockVault(passphrase) {
        this.masterKey = await this.deriveKey(passphrase);
        sessionStorage.setItem("family_e2ee_unlocked", "true");
        const btn = document.getElementById('e2eeKeyBtn');
        if (btn) {
            btn.innerText = "🔓 保險箱已解鎖";
            btn.style.color = "var(--oasis-success)";
        }
    },

    async encrypt(text) {
        if (!text || typeof text !== 'string') return text;
        if (!this.masterKey) {
            throw new Error("E2EE_LOCKED");
        }
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const ciphertext = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv },
            this.masterKey,
            encoded
        );

        return {
            is_encrypted: true,
            iv: btoa(String.fromCharCode(...iv)),
            data: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
        };
    },

    async decrypt(target) {
        if (!target) return "";
        if (typeof target !== 'object' || !target.is_encrypted) return String(target);
        if (!this.masterKey) return "🔒 [需要家庭主密鑰]";

        try {
            const iv = Uint8Array.from(atob(target.iv), c => c.charCodeAt(0));
            const ciphertext = Uint8Array.from(atob(target.data), c => c.charCodeAt(0));
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv },
                this.masterKey,
                ciphertext
            );
            return new TextDecoder().decode(decrypted);
        } catch {
            return "🔒 [主密鑰不相符]";
        }
    }
};

async function promptMasterVaultKey() {

        "輸入家庭共享密鑰...",

// ─── 🛡️ 登入防爆破限制器 (Rate Limiter) ───
const LoginRateLimiter = {
    MAX_ATTEMPTS: 5,
    LOCKOUT_MS: 15 * 60 * 1000,

    checkStatus() {
        const lockUntil = parseInt(localStorage.getItem("family_lockout_time") || "0", 10);
        const now = Date.now();
        if (now < lockUntil) {
            const remainingMins = Math.ceil((lockUntil - now) / 60000);
            return { locked: true, remainingMins };
        }
        return { locked: false };
    },

    recordFailure() {
        let attempts = parseInt(localStorage.getItem("family_login_fail_count") || "0", 10) + 1;
        if (attempts >= this.MAX_ATTEMPTS) {
            localStorage.setItem("family_lockout_time", Date.now() + this.LOCKOUT_MS);
            localStorage.setItem("family_login_fail_count", "0");
            return { locked: true, remainingMins: 15 };
        }
        localStorage.setItem("family_login_fail_count", attempts.toString());
        return { locked: false, remainingAttempts: this.MAX_ATTEMPTS - attempts };
    },

    recordSuccess() {
        localStorage.removeItem("family_login_fail_count");
        localStorage.removeItem("family_lockout_time");
    }
};

// 📱 登入驗證
async function verifyGatePassword() {
    const lockCheck = LoginRateLimiter.checkStatus();
    if (lockCheck.locked) {
        showToast(`❌ 登入嘗試次數過多，請等待 ${lockCheck.remainingMins} 分鐘`, "error");
        return;
    }

    const inputPwd = document.getElementById('popupPassword').value.trim();
    const btn = document.getElementById('loginSubmitBtn');
    const errBox = document.getElementById('loginErrorMsg');
    errBox.style.display = "none";

    if (!inputPwd) {
        errBox.innerText = "請輸入密碼！";
        errBox.style.display = "block";
        return;
    }

    let emailsToTest = [];
    let memberLabel = "鐵";
    if (isManualEmail) {
        const manual = document.getElementById('manualEmailInput').value.trim();
        emailsToTest = [manual];
    } else {
        const memberKey = document.getElementById('loginMemberSelect').value;
        emailsToTest = CANDIDATE_EMAILS[memberKey] || ["ironijkl@gmail.com"];
        memberLabel = MEMBER_NAME_MAP[memberKey] || "鐵";
    }

    btn.disabled = true;
    btn.innerText = "驗證中...";

    try {
        let authSuccess = false;
        for (const testEmail of emailsToTest) {
            try {
                await window.fbSignIn(window.fbAuth, testEmail, inputPwd);
                authSuccess = true;
                break;
            } catch (authErr) {}
        }

        if (authSuccess) {
            LoginRateLimiter.recordSuccess();
            applyAdminState(memberLabel);
            showToast(`✓ 歡迎 ${memberLabel}！`, "success");
            document.getElementById('lockSection').style.display = 'none';
            document.getElementById('secureFormPanel').style.display = 'block';
            document.getElementById('eventAssignee').value = memberLabel;
            
            // 登入後若尚未解鎖主保險箱，引導解鎖
            if (!E2EE.masterKey) {
                setTimeout(() => promptMasterVaultKey(), 400);
            }
        } else {
            const failStatus = LoginRateLimiter.recordFailure();
            if (failStatus.locked) {
                errBox.innerText = "❌ 密碼錯誤已達 5 次，系統鎖定 15 分鐘！";
            } else {
                errBox.innerText = `❌ 密碼不正確！剩餘次數：${failStatus.remainingAttempts}`;
            }
            errBox.style.display = "block";
        }
    } catch (e) {
        errBox.innerText = "❌ 系統異常：" + e.message;
        errBox.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.innerText = "登入驗證";
    }
}

// 📱 Apple 必審：帳號刪除流程 (修復 P0-4 與 P0-5)
async function handleDeleteAccount() {
    // 確保 Session 已完全 restore
    if (window.fbAuth && window.fbAuth.authStateReady) {
        await window.fbAuth.authStateReady();
    }
    const user = window.fbAuth?.currentUser;
    if (!user) {
        await CustomDialog.alert("提示", "目前尚未登入任何帳號！");
        return;
    }

    const confirmFirst = await CustomDialog.confirm(
        "永久刪除帳號",
        "此操作為不可逆行為。將會註銷您的憑證並永久刪除帳號設定。確定繼續？",
        true
    );
    if (!confirmFirst) return;

    const confirmPassword = await CustomDialog.prompt(
        "驗證身分",
        "為了安全起見，請輸入密碼以確認註銷刪除：",
        "輸入登入密碼...",
        true
    );
    if (!confirmPassword) return;

    showToast("正在處理帳號註銷...", "normal");

    try {
        // 1. 於 deleteUser 前一刻完成 Reauth
        const credential = window.fbEmailAuthProvider.credential(user.email, confirmPassword);
        await window.fbReauth(user, credential);

        // 2. 清理伺服器端資料
        if (currentUserMemberName && window.fbDb && window.fbRef && window.fbRemove) {
            await window.fbRemove(window.fbRef(window.fbDb, `family_members/${currentUserMemberName}`));
        }

        // 3. 刪除使用者
        await window.fbDeleteUser(user);

        // 4. 清理本地所有狀態
        localStorage.clear();
        sessionStorage.clear();
        renderUnauthenticatedState();
        closeEventPopup();

        await CustomDialog.alert("帳號已刪除", "您的帳戶及相關個人設定已成功永久刪除。");
        location.reload();
    } catch (error) {
        console.error("帳號刪除失敗:", error);
        if (error.code === "auth/wrong-password") {
            await CustomDialog.alert("錯誤", "密碼不正確，刪除操作已中止。");
        } else if (error.code === "auth/requires-recent-login") {
            await CustomDialog.alert("錯誤", "登入時間過長，請重新登入後再次嘗試。");
        } else {
            await CustomDialog.alert("錯誤", "刪除失敗：" + error.message);
        }
    }
}

async function addFamilyEvent() {
    if (userRole !== "admin") {
        await CustomDialog.alert("權限不足", "訪客模式無法新增行程，請先登入！");
        return;
    }

    let rawTitle = document.getElementById('eventTitle').value.trim();
    let startVal = document.getElementById('eventTime').value.trim();
    let endVal = document.getElementById('eventEndTime').value.trim();
    let assignee = document.getElementById('eventAssignee').value;
    let chosenCategory = document.getElementById('eventCategory').value;

    if (!rawTitle || !startVal) {
        await CustomDialog.alert("提示", "請填寫活動名稱與開始時間！");
        return;
    }

    // 檢查保險箱是否解鎖
    if (!E2EE.masterKey) {
        await CustomDialog.alert("保險箱未解鎖", "請先點擊頂部「解鎖保險箱」輸入家庭主密鑰，才能加密並儲存行程！");
        return;
    }

    let detectedDate = startVal.split(' ')[0] || selectedDateStr;
    let detectedEndDate = endVal ? (endVal.split(' ')[0] || detectedDate) : detectedDate;
    let timeLabel = startVal.split(' ')[1] || "20:30";
    if (endVal) timeLabel = `${timeLabel} ~ ${endVal.split(' ')[1] || endVal}`;

    const newId = "local_" + Date.now();
    const localActivityObj = {
        id: newId,
        date: detectedDate,
        endDate: detectedEndDate,
        time: timeLabel,
        title: rawTitle,
        assignee: assignee,
        category: chosenCategory,
        status: "待處理"
    };

    // 1. 本地立即渲染
    activities.unshift(localActivityObj);
    localStorage.setItem('family_cached_activities', JSON.stringify(activities));
    triggerPipelineRefresh();
    showToast(`✓ 已成功新增「${rawTitle}」！`, "success");

    closeEventPopup();
    document.getElementById('eventTitle').value = "";

    // 2. 雲端真 E2EE 儲存
    try {
        const encryptedTitle = await E2EE.encrypt(rawTitle);
        const payload = {
            title: encryptedTitle,
            date: detectedDate,
            endDate: detectedEndDate,
            time: timeLabel,
            assignee: assignee,
            category: chosenCategory,
            status: "待處理",
            updatedAt: Date.now()
        };

        if (window.fbDb && window.fbRef && window.fbPush) {
            const newRef = window.fbPush(window.fbRef(window.fbDb, "family_calendar_activities"));
            await window.fbSet(newRef, payload);
        }
    } catch (err) {
        console.warn("雲端同步延遲:", err);
    }
}

function isEventActiveOnDate(event, dateStr) {
    if (!event || !event.date) return false;
    let start = String(event.date).split(' ')[0];
    let end = String(event.endDate || event.date).split(' ')[0];
    return (dateStr >= start && dateStr <= end);
}

function triggerPipelineRefresh() {
    renderCalendarWithData(activities);
}

function renderCalendarWithData(dataset) {
    let y = current.getFullYear();
    let m = current.getMonth();
    document.getElementById('monthLabel').innerText = `${y}年 ${m + 1}月`;
    
    let firstDayIndex = new Date(y, m, 1).getDay();
    let daysCount = new Date(y, m + 1, 0).getDate();
    let todayDateStr = formatLocalDate(new Date());
    let fragment = document.createDocumentFragment();

    for (let i = 0; i < firstDayIndex; i++) {
        let cell = document.createElement('div');
        cell.className = "calendar-day empty";
        fragment.appendChild(cell);
    }

    for (let i = 1; i <= daysCount; i++) {
        let dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        let isToday = (todayDateStr === dStr);
        let isSelected = (selectedDateStr === dStr);

        let dayActivities = dataset.filter(a => isEventActiveOnDate(a, dStr));
        let eventsHtml = "";

        dayActivities.forEach(act => {
            eventsHtml += `<span class="day-event-badge" style="background:rgba(0,113,227,0.12); color:#0071e3; border-left:3px solid #0071e3;">${act.time} ${DOMPurify.sanitize(act.title)}</span>`;
        });

        let dayCell = document.createElement('div');
        dayCell.className = "calendar-day" + (isToday ? " today" : "") + (isSelected ? " selected-day" : "");
        dayCell.onclick = () => selectDate(dStr);

        dayCell.innerHTML = `<strong>${i}</strong><div class="day-events-container">${eventsHtml}</div>`;
        fragment.appendChild(dayCell);
    }

    const cal = document.getElementById('calendar');
    cal.innerHTML = "";
    cal.appendChild(fragment);
    renderDayEvents(dataset);
}

function selectDate(dateStr) {
    selectedDateStr = dateStr;
    document.getElementById('selectedDateLabel').innerText = selectedDateStr;
    triggerPipelineRefresh();
}

function renderDayEvents(dataset) {
    let container = document.getElementById('dayEvents');
    let filtered = dataset.filter(a => isEventActiveOnDate(a, selectedDateStr));
    if (filtered.length === 0) {
        container.innerHTML = `<p style="color:var(--apple-text-secondary); text-align:center; padding:15px 0; font-size:14px;">此日暫無行程。</p>`;
        return;
    }
    let html = "";
    filtered.forEach(ev => {
        html += `<div class="event-item"><div class="event-time">⏰ ${ev.time}</div><div class="event-desc">📌 <strong>${DOMPurify.sanitize(ev.title)}</strong></div><div class="event-meta-tags"><span style="font-size:11px; padding:3px 8px; border-radius:16px; font-weight:600; background:#e5f1ff; color:#0071e3;">${ev.category || '家庭'}</span><span style="font-size:11px; padding:3px 8px; border-radius:16px; font-weight:600; background:#eef9f0; color:#28a745;">👤 ${ev.assignee || '全員'}</span></div></div>`;
    });
    container.innerHTML = html;
}

        text += `${idx + 1}. ⏰ ${e.time} - ${e.title} (👤 ${e.assignee})\n`;
    });
    text += `\n請大家留意時間！❤️`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
}

function changeMonth(dir) {
    current.setDate(1);
    current.setMonth(current.getMonth() + dir);
    triggerPipelineRefresh();
}
</script>
</body>
