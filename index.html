<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 麟李互助家庭日誌 (智慧功能升級版)</title>

<style>
body { font-family: Arial, sans-serif; margin:0; font-size:18px; background:#f5f5f5; }

header {
    background:#25D366;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container { padding:10px; }

/* ─── 🛠️ 頂部操作按鈕 5 鍵平排外觀 ─── */
.top-action-card {
    background: white;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: row; 
    gap: 6px;
    width: 100%;
    box-sizing: border-box;
}

.top-action-card button.action-btn {
    flex: 1;
    margin: 0 !important; 
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    padding: 12px 6px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
}
.top-action-card button.action-btn:hover { opacity: 0.9; }

@media (max-width: 650px) {
    .top-action-card { flex-wrap: wrap; gap: 6px; }
    .top-action-card button.action-btn {
        flex: 1 1 calc(33.33% - 6px);
        font-size: 13px !important;
        padding: 10px 4px !important;
    }
}

.card {
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.calendar-header {
    display: flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 15px;
}

.nav-btn {
    width:25%;
    padding:10px;
    font-size:16px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.month-title { font-size:22px; font-weight:bold; }
.weekdays-container { display: flex; width: 100%; margin-bottom: 5px; }
.weekday { flex: 1; text-align:center; color:gray; font-weight:bold; font-size:16px; }

.calendar { display: flex; flex-wrap: wrap; width: 100%; }
.calendar-day {
    display: inline-block;
    width: 14.2857%;
    padding:6px 2px;
    text-align:center;
    background:white;
    border-radius:10px;
    margin-bottom:6px;
    min-height:115px;
    font-size:18px;
    vertical-align: top;
    box-sizing: border-box;
    cursor: pointer;
    border: 1px solid #f0f0f0;
    overflow: hidden;
    position: relative;
}
.calendar-day:hover { background: #e8f9ed; }
.empty { background:transparent; border: none; cursor: default; }

.today { border:3px solid orange; }
.selected-day { background: #d0f5db !important; border: 2px solid #25D366; }
.multiday-pass-range { background: rgba(37, 211, 102, 0.12) !important; }
.hk-holiday-pass-range { background: rgba(255, 77, 79, 0.1) !important; }
.hk-holiday-pass-range strong { color: #ff4d4f !important; }

.lunar { font-size:12px; color:#666; margin-top: 2px; }
.holiday { font-size:11px; color:#ff4d4f; font-weight:bold; margin-top: 2px; }

.day-event-badge {
    font-size: 11px;
    background: #e6f7ff;
    color: #1890ff;
    border-left: 3px solid #1890ff;
    padding: 2px 4px;
    margin-top: 3px;
    text-align: left;
    border-radius: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
}

/* 發送通知及刪除/修改按鍵樣式 */
button.pretty-whatsapp-btn {
    background: linear-gradient(135deg, #25D366, #20ba59);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(37,211,102,0.3);
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.action-btn-group-row { display: flex; gap: 6px; }
button.pretty-delete-btn {
    background: linear-gradient(135deg, #ff4d4f, #ff7875);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}
button.pretty-edit-btn {
    background: linear-gradient(135deg, #1890ff, #40a9ff);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

/* 📸 實體拍照上傳專用按鈕樣式 */
.camera-upload-row { display: flex; gap: 8px; margin: 8px 0; }
.camera-btn {
    flex: 1;
    background: linear-gradient(135deg, #e67e22, #d35400);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.camera-btn.video-mode { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
.upload-preview-box { max-width: 100%; height: auto; max-height: 120px; border-radius: 8px; margin: 8px 0; display: none; object-fit: cover; border: 2px dashed #ccc; }

/* 智慧型雙向輸入列排版樣式 */
.twin-input-wrapper { display: flex; align-items: center; position: relative; width: 100%; }
.twin-input-wrapper input[type="text"] { flex: 1; cursor: pointer; background: #fff; }
.wheel-trigger-box { position: absolute; right: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: flex-end; pointer-events: none; }
.wheel-btn { background: transparent !important; border: none !important; width: 44px; height: 100%; position: relative; pointer-events: auto; }
.picker-overlay-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0 !important; cursor: pointer; z-index: 5; }

/* 彈窗基本樣式 */
.popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); z-index: 1000; overflow-y: auto; }
.popup-content-card { position: relative; background: white; width: 90%; max-width: 550px; margin: 50px auto; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
.popup-close-x { position: absolute; top: 15px; right: 18px; font-size: 24px; color: #8c8c8c; cursor: pointer; font-weight: bold; }
.password-lock-section { background: #fffbe6; border: 1px solid #ffe58f; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: center; }
.secure-form-fields { display: none; margin-top: 15px; }

button.action-btn-block { width:100%; padding:12px; margin-top:8px; background:#25D366; color:white; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; }
input, textarea, select { width:100%; padding:12px; margin:6px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

/* 🆕 智慧型活動列表與微型晶片樣式 */
.event-item { background: #f9f9f9; padding: 12px; border-left: 4px solid #25D366; margin-bottom: 8px; border-radius: 0 8px 8px 0; }
.event-time { font-weight: bold; color: #333; }
.event-desc { margin-top: 4px; color: #555; }
.event-meta-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.meta-chip { font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 3px; }
.chip-member { background: #e8f5e9; color: #2e7d32; }
.chip-repeat { background: #e1f5fe; color: #0288d1; }
.chip-reminder { background: #fff3e0; color: #ef6c00; }
.chip-ai { background: #f3e5f5; color: #7b1fa2; border: 1px dashed #ab47bc; }

/* ─── 📸 互助相簿牆排版樣式 ─── */
.album-header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
button.inline-upload-trigger-btn { background: linear-gradient(135deg, #e67e22, #d35400); color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(230,126,34,0.3); }

.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
.album-item { background: white; border-radius: 10px; overflow: hidden; padding: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); text-align: center; position: relative; border: 1px solid #eee; transition: transform 0.2s; }
.album-item:hover { transform: scale(1.02); }
.album-item img, .event-item img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
.album-item video, .event-item video { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; background: #000; cursor: zoom-in; }
.album-title { font-size: 13px; font-weight: bold; margin-top: 6px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.album-date-badge { font-size: 11px; color: #1890ff; background: #e6f7ff; padding: 1px 4px; border-radius: 4px; display: inline-block; margin-top: 2px; }
.album-delete-tag { position: absolute; top: 4px; right: 4px; background: rgba(255,47,47,0.9); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 10; }

/* ─── 🔍 全螢幕高質感大圖大影片燈箱樣式 ─── */
.lightbox-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 2000; align-items: center; justify-content: center; cursor: zoom-out; }
.lightbox-content { max-width: 95%; max-height: 85%; border-radius: 12px; box-shadow: 0 4px 25px rgba(255,255,255,0.1); cursor: default; animation: zoomInEffect 0.25s ease-out; }
@keyframes zoomInEffect { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 視圖樣式 */
.view-精簡 .day-event-badge { display: none !important; }
.view-詳細資料 .calendar-day { min-height: 140px !important; }
.view-詳細資料 .day-event-badge { white-space: normal !important; word-break: break-all !important; }
.view-option-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
.view-radio-label { display: flex; align-items: center; background: #f5f5f5; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.view-radio-label input { width: auto; margin: 0 10px 0 0; transform: scale(1.3); }
</style>
</head>

<body class="view-列表" id="bodyNode">

<header>📅 麟李互助家庭日誌 (智慧功能升級版)</header>

<div class="container">

    <div class="top-action-card">
        <button class="action-btn" style="background: #25D366;" onclick="openAddFormPopup('ADD')">➕ 活動</button>
        <button class="action-btn" style="background: #1890ff;" onclick="openAddFormPopup('MANAGE')">⚙️ 修改/刪除</button>
        <button class="action-btn" style="background: #f39c12;" onclick="openAddFormPopup('ALBUM')">🏡 互助相簿</button>
        <button class="action-btn" style="background: #00c642;" onclick="openAddFormPopup('WHATSAPP')">💬 WHATSAPP 通知</button>
        <button class="action-btn" style="background: #722ed1;" onclick="openAddFormPopup('SWITCH_VIEW')">👁️ 視覺</button>
    </div>

    <div class="card">
        <div class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)">⬅ 上一月</button>

            <button class="nav-btn" onclick="changeMonth(1)">下一月 ➡</button>
        </div>
        <div class="weekdays-container">
            <div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div>
        </div>
        <div id="calendar" class="calendar"></div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; color:#333;">📋 <span id="selectedDateLabel"></span> 活動日程</h3>
        <div id="dayEvents"></div>
    </div>

    <div class="card">
        <div class="album-header-container">
            <h3 style="margin:0; color:#f39c12;">🖼️ 本月麟李家庭互助相簿 / 短片分享牆</h3>
            <button class="inline-upload-trigger-btn" onclick="openAddFormPopup('ALBUM')">➕ 上傳相片/短片</button>
        </div>
        <div id="mainAlbumGrid" class="album-grid"></div>
    </div>

    <div class="popup-overlay" id="addEventPopupOverlay" onclick="closePopupOverlayOutside(event)">
        <div class="popup-content-card">
            <span class="popup-close-x" onclick="closeEventPopup()">&times;</span>
            <h3 id="formTitle">➕ 新增家庭活動</h3>
            <input type="hidden" id="editKey" value="">

            <div class="password-lock-section" id="lockSection">
                 <div style="display:flex; gap:8px;">
                    <input type="password" id="popupPassword" placeholder="輸入密碼進入面板..." style="margin:0; flex:1; padding:10px;">
                    <button type="button" class="action-btn" style="margin:0; width:auto; padding:10px 20px; background:#1890ff; border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;" onclick="verifyGatePassword()">確認進入</button>
                </div>
            </div>

            <div class="secure-form-fields" id="secureFormPanel">
                <label for="eventTitle">活動名稱 / 地點：</label>
                <input type="text" id="eventTitle" placeholder="例如：蓓 8:30 放學、二胡課">
         
                <label for="eventTime">📅 開始日期時間：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="eventTime" placeholder="點擊選取開始日期與時間" readOnly onclick="document.getElementById('nativeStartPicker').showPicker()">
                    <div class="wheel-trigger-box">
                         <div class="wheel-btn">
                            <input type="datetime-local" id="nativeStartPicker" class="picker-overlay-input" onchange="syncFormComboPicker(this, 'eventTime')">
                        </div>
                    </div>
                </div>

                <label for="eventEndTime">📆 結束日期時間：</label>
                <div class="twin-input-wrapper">
                    <input type="text" id="eventEndTime" placeholder="點擊選取結束日期與時間 (選填)" readOnly onclick="document.getElementById('nativeEndPicker').showPicker()">
                    <div class="wheel-trigger-box">
                         <div class="wheel-btn">
                            <input type="datetime-local" id="nativeEndPicker" class="picker-overlay-input" onchange="syncFormComboPicker(this, 'eventEndTime')">
                        </div>
                    </div>
                </div>

                <div style="background: #eef9ff; border: 1px solid #bae7ff; padding: 12px; border-radius: 8px; margin: 12px 0;">
                    <label style="font-weight:bold; color:#0050b3; display:block; margin-bottom:6px;">⚙️ 智慧日程排程設定（同步 Firebase）：</label>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div>
                            <label for="eventRepeat" style="font-size:14px; color:#444; font-weight:bold;">🔁 重複週期：</label>
                            <select id="eventRepeat" style="padding:8px; margin:4px 0;">
                                <option value="不重複">不重複</option>
                                <option value="每日">每日</option>
                                <option value="每週">每週</option>
                                <option value="每月">每月</option>
                            </select>
                        </div>
                        <div>
                            <label for="eventReminder" style="font-size:14px; color:#444; font-weight:bold;">⏰ 提醒通知：</label>
                            <select id="eventReminder" style="padding:8px; margin:4px 0;">
                                <option value="無">無</option>
                                <option value="10分鐘前">10分鐘前</option>
                                <option value="1小時前">1小時前</option>
                                <option value="1日前">1日前</option>
                            </select>
                        </div>
                    </div>

                    <label for="eventAssignee" style="font-size:14px; color:#444; font-weight:bold; margin-top:6px; display:block;">👥 成員分工 / 負責人：</label>
                    <input type="text" id="eventAssignee" placeholder="例如：負責人、開車接送者" style="padding:8px; margin:4px 0;">
                </div>
                
                <div style="background: #fffdf6; border: 1px dashed #f39c12; padding: 12px; border-radius: 8px; margin: 12px 0;">
                    <label style="font-weight:bold; color:#e67e22; display:block; margin-bottom:4px;">🖼️ 隨附相片或短片 (選填)：</label>
                    <div class="camera-upload-row">
                        <button type="button" class="camera-btn" onclick="triggerFileInput('FormImage')">📷 拍照 / 選擇相片</button>
                        <button type="button" class="camera-btn video-mode" onclick="triggerFileInput('FormVideo')">🎥 錄影 / 選擇短片</button>
                    </div>
                    <input type="file" id="formImageInput" accept="image/*" capture="environment" style="display:none;" onchange="handleFormFileLoad(this, 'image')">
                    <input type="file" id="formVideoInput" accept="video/*" capture="environment" style="display:none;" onchange="handleFormFileLoad(this, 'video')">
                    
                    <img id="formImagePreview" class="upload-preview-box">
                    <video id="formVideoPreview" class="upload-preview-box" controls></video>
                    
                    <input type="text" id="formMediaURL" placeholder="或貼上現有的網路媒體網址 URL" style="margin-top:6px;">
                    <select id="formMediaType">

                <button id="formSubmitBtn" class="action-btn-block" style="background:#25D366;" onclick="addFamilyEvent()">儲存至此日期</button>

            <div class="secure-form-fields" id="secureManagePanel">

            </div>

            <div class="secure-form-fields" id="secureWhatsAppPanel">
                <label style="font-weight:bold; color:#00c642; display:block; margin-bottom:12px;">💬 請選取欲發送 WhatsApp 通知的行程：</label>
                <div id="popupWhatsAppList"></div>
            </div>

            <div class="secure-form-fields" id="secureAlbumPanel">

                <input type="text" id="mediaTitle" placeholder="輸入相片描述或活動名稱">
                
                <div class="camera-upload-row">
                    <button type="button" class="camera-btn" onclick="triggerFileInput('image')">📷 拍照 / 選擇相片</button>
                    <button type="button" class="camera-btn video-mode" onclick="triggerFileInput('video')">🎥 錄影 / 選擇短片</button>
                </div>
                
                <input type="file" id="nativeImageInput" accept="image/*" capture="environment" style="display:none;" onchange="handleNativeFileLoad(this, 'image')">

                <select id="mediaType">

                <div id="popupAlbumManageList" class="album-grid"></div>
            </div>

            <div class="secure-form-fields" id="secureViewSwitchPanel">
                <div class="view-option-group">
                    <label class="view-radio-label"><input type="radio" name="viewMode" value="精簡" onclick="changeGlobalViewMode('精簡')"> ▤ 精簡</label>

                    <label class="view-radio-label"><input type="radio" name="viewMode" value="列表" onclick="changeGlobalViewMode('列表')"> ✓ ☰ 列表</label>

            <button class="action-btn-block" style="background:#8c8c8c; margin-top:15px;" onclick="closeEventPopup()">關閉面板</button>
        </div>
    </div>

    <div id="globalLightboxOverlay" class="lightbox-overlay" onclick="closeLightboxWindow()">
        <div id="lightboxMediaContainer" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>
    </div>

</div>

<script>
const dbURL = "https://familycalender-a62ae-default-rtdb.firebaseio.com/family_calendar_activities";
const albumURL = "https://familycalender-a62ae-default-rtdb.firebaseio.com/family_mutual_album";

let activities = [];
let albumItems = [];
let current = new Date(); 
let selectedDateStr = new Date().toISOString().slice(0, 10); 
let currentPopupMode = "ADD";
let currentGlobalMode = localStorage.getItem('family_日誌_view_mode') || "列表";
let uploadedBase64Cache = ""; 
let formUploadedBase64Cache = "";

/* ─── 📸 拍照與檔案載入控制引擎 ─── */
function triggerFileInput(type) {
    if (type === 'image') document.getElementById('nativeImageInput').click();
    if (type === 'video') document.getElementById('nativeVideoInput').click();
    if (type === 'FormImage') document.getElementById('formImageInput').click();
    if (type === 'FormVideo') document.getElementById('formVideoInput').click();
}

function launchLightboxView(srcUrl, mediaType) {
    let overlay = document.getElementById('globalLightboxOverlay');
    let container = document.getElementById('lightboxMediaContainer');
    if (mediaType === 'video') {
        container.innerHTML = `<video src="${srcUrl}" class="lightbox-content" controls autoplay onclick="event.stopPropagation()"></video>`;
    } else {
        container.innerHTML = `<img src="${srcUrl}" class="lightbox-content" onclick="event.stopPropagation()">`;
    }
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeLightboxWindow() {
    document.getElementById('globalLightboxOverlay').style.display = 'none';
    document.getElementById('lightboxMediaContainer').innerHTML = ""; 
    document.body.style.overflow = 'auto';
}

function handleNativeFileLoad(input, type) {
    let file = input.files[0]; if (!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        uploadedBase64Cache = e.target.result;
        document.getElementById('mediaType').value = type;
        if (type === 'image') {
            document.getElementById('imageUploadPreview').src = uploadedBase64Cache;
            document.getElementById('imageUploadPreview').style.display = 'block';
            document.getElementById('videoUploadPreview').style.display = 'none';
        } else {
            document.getElementById('videoUploadPreview').src = uploadedBase64Cache;
            document.getElementById('videoUploadPreview').style.display = 'block';
            document.getElementById('imageUploadPreview').style.display = 'none';
        }
    };
    reader.readAsDataURL(file);
}

function handleFormFileLoad(input, type) {
    let file = input.files[0]; if (!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        formUploadedBase64Cache = e.target.result;
        document.getElementById('formMediaType').value = type;
        if (type === 'image') {
            document.getElementById('formImagePreview').src = formUploadedBase64Cache;
            document.getElementById('formImagePreview').style.display = 'block';
            document.getElementById('formVideoPreview').style.display = 'none';
        } else {
            document.getElementById('formVideoPreview').src = formUploadedBase64Cache;
            document.getElementById('formVideoPreview').style.display = 'block';
            document.getElementById('formImagePreview').style.display = 'none';
        }
    };
    reader.readAsDataURL(file);
}

/* ─── 📸 互助相簿牆排版樣式（含 AI 自動標籤功能） ─── */
function renderMainAlbumUI() {
    let mainGrid = document.getElementById('mainAlbumGrid');
    let popGrid = document.getElementById('popupAlbumManageList');
    
    let currentY = current.getFullYear();
    let currentM = String(current.getMonth() + 1).padStart(2, '0');
    let currentMonthPrefix = `${currentY}-${currentM}`;

    let currentMonthMediaItems = albumItems.filter(item => item.date && item.date.startsWith(currentMonthPrefix));
    if (currentMonthMediaItems.length === 0) {
        let noDataHtml = `<p style="color:gray; font-size:14px; grid-column: 1/-1; text-align:center; padding: 25px 0;">本月份（${currentY}年${currentM}月）暫無互助分享相片或短片。</p>`;
        mainGrid.innerHTML = noDataHtml;
        if(popGrid) popGrid.innerHTML = noDataHtml;
        return;
    }

    let mainHtml = ""; let popHtml = "";
    currentMonthMediaItems.forEach(item => {
        let mediaTag = item.type === "video" ? 
            `<video src="${item.url}" onclick="launchLightboxView('${item.url}', 'video')"></video>` : 
            `<img src="${item.url}" onclick="launchLightboxView('${item.url}', 'image')" onerror="this.src='https://placehold.co/150x110?text=Error'">`;
            
        let popMediaTag = item.type === "video" ? `<video src="${item.url}" controls></video>` : `<img src="${item.url}">`;

        // 🤖 整合提案：前端智能模擬分群標籤演算法
        let aiLabel = "🤖 AI標籤: 家庭 / 聚會";
        if (item.title.includes("排球") || item.title.includes("大排") || item.title.includes("練")) {
            aiLabel = "🤖 AI標籤: 體育 / 運動訓練";
        } else if (item.title.includes("二胡") || item.title.includes("音樂") || item.title.includes("課")) {
            aiLabel = "🤖 AI標籤: 學習 / 藝術培育";
        }

        mainHtml += `
        <div class="album-item">
            ${mediaTag}
            <div class="album-title">${item.title}</div>
            <div style="font-size: 11px; color:#7b1fa2; font-weight: bold; margin-top:2px;">${aiLabel}</div>
            <div class="album-date-badge">📅 ${item.date}</div>
        </div>`;
        
        popHtml += `<div class="album-item"><button class="album-delete-tag" onclick="deleteMediaFromAlbum('${item.id}')">×</button>${popMediaTag}<div class="album-title">${item.title}</div><div class="album-date-badge">${item.date}</div></div>`;
    });
    mainGrid.innerHTML = mainHtml;
    if(popGrid) popGrid.innerHTML = popHtml;
}

/* ─── 🌐 核心功能：完美融合三大新欄位投遞 Firebase ─── */
function addFamilyEvent() {
    let title = document.getElementById('eventTitle').value.trim();
    let startVal = document.getElementById('eventTime').value.trim();
    let endVal = document.getElementById('eventEndTime').value.trim();
    let editKey = document.getElementById('editKey').value;

    // 🆕 取得升級的擴充欄位數值
    let repeat = document.getElementById('eventRepeat').value;
    let reminder = document.getElementById('eventReminder').value;
    let assignee = document.getElementById('eventAssignee').value.trim();

    if (!title || !startVal) { alert("請填寫活動名稱與開始時間！"); return; }

    let detectedDate = startVal.split(' ')[0] || selectedDateStr;
    let timeLabel = startVal.split(' ')[1] || "08:30";
    if (endVal) {
        let endTimeLabel = endVal.split(' ')[1] || endVal;
        timeLabel = `${timeLabel} ~ ${endTimeLabel}`;
    }

    // 🆕 將新功能完美對接打包進入 payload 物件
    let payload = { 
        title: title, 
        date: detectedDate, 
        time: timeLabel, 
        note: "",
        repeat: repeat,
        reminder: reminder,
        assignee: assignee
    };
    
    let method = editKey ? "PUT" : "POST";
    let targetURL = editKey ? `${dbURL}/${editKey}.json` : `${dbURL}.json`;
    
    fetch(targetURL, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }).then(() => {
        let formMediaData = formUploadedBase64Cache ? formUploadedBase64Cache : document.getElementById('formMediaURL').value.trim();
        let formMediaType = document.getElementById('formMediaType').value;
        
        if (formMediaData) {
            fetch(`${albumURL}.json`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: `隨附活動: ${title}`, url: formMediaData, type: formMediaType, date: detectedDate })
            }).then(() => { completeAction(); });
        } else {
            completeAction();
        }
    });

    function completeAction() {
        document.getElementById('eventTitle').value = "";
        resetFormPhotoUpload();
        closeEventPopup();
        alert("🎉 家庭活動與時間已成功儲存並同步至雲端！");
        fetchCloudData();
    }
}

function uploadMediaToAlbum() {
    let title = document.getElementById('mediaTitle').value.trim();
    let url = document.getElementById('mediaURL').value.trim();
    let type = document.getElementById('mediaType').value;
    let finalMediaData = uploadedBase64Cache ? uploadedBase64Cache : url;

    if (!title || !finalMediaData) { alert("請輸入描述並拍照、錄影或輸入媒體網址！"); return; }

    fetch(`${albumURL}.json`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: title, url: finalMediaData, type: type, date: selectedDateStr })
    }).then(() => {
        resetPhotoUploadForm();
        alert("🎉 成功上傳添加至麟李家庭相簿！");
        fetchCloudData();
    });
}

function sendWhatsAppNotification(id) {
    let ev = activities.find(a => a.id === id); if (!ev) return;
    
    // 🆕 生成 WhatsApp 文字時自動夾帶負責人與提醒設定
    let智慧特徵 = "";
    if (ev.assignee) 智慧特徵 += `\n👥 負責分工：${ev.assignee}`;
    if (ev.repeat && ev.repeat !== "不重複") 智慧特徵 += `\n🔁 重複週期：${ev.repeat}`;
    if (ev.reminder && ev.reminder !== "無") 智慧特徵 += `\n⏰ 提醒設定：${ev.reminder}`;

    let textMessage = `💡【麟李互助家庭日誌 - 行程通知】\n\n📅 日期：${ev.date}\n⏰ 時間：${ev.time}\n📌 項目：${ev.title}${智慧特徵}\n\n請大家安排好時間，互相照顧扶持！❤️`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textMessage)}`, '_blank');
}

const holidays2026 = {
    "01-01":"元旦", "02-17":"年初一", "02-18":"年初二", "02-19":"年初三", "04-03":"受難節", "04-04":"清明節", "05-01":"勞動節", "05-25":"佛誕", "06-19":"端午節", "07-01":"七一回歸日", "10-01":"國慶日", "12-25":"聖誕節", "12-26":"節禮日"
};
function getHKHoliday(m, d) { return holidays2026[`${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`] || ""; }

function getLunarDayText(dateStr) {
    try {
        let d = new Date(dateStr);
        if (isNaN(d.getTime())) return "";
        let parts = new Intl.DateTimeFormat("zh-Hant-u-ca-chinese", {month:"numeric", day:"numeric"}).formatToParts(d);
        let month = parts.find(p => p.type === 'month').value;
        let day = Number(parts.find(p => p.type === 'day').value);
        const CN = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
        if (day === 1) return ["", "正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "冬月", "臘月"][Number(month)];
        if (day <= 10) return "初" + CN[day]; if (day < 20) return "十" + CN[day - 10];
        if (day === 20) return "二十"; if (day < 30) return "廿" + CN[day - 20]; return "三十";
    } catch(e) { return ""; }
}

/* ─── 📥 數據加載與聯網同步 ─── */
function fetchCloudData() {
    fetch(`${dbURL}.json`, { method: "GET" }).then(res => res.json()).then(data => {
        activities = [];
        if (data) {
            for (let key in data) {
                if (data[key]) {
                    activities.push({
                        id: key, date: data[key].date ? data[key].date.trim() : "",
                        time: data[key].time || "全日安排", title: data[key].title || "行程",
                        note: data[key].note || "", isMultiDayEvent: data[key].isMultiDayEvent || false,
                        multiDayRangeArray: data[key].multiDayRangeArray || [],
                        // 🆕 解析並還原雲端下載的欄位
                        repeat: data[key].repeat || "不重複",
                        reminder: data[key].reminder || "無",
                        assignee: data[key].assignee || ""
                    });
                }
            }
        }
        fetch(`${albumURL}.json`, { method: "GET" }).then(res => res.json()).then(albumData => {
            albumItems = [];
            if (albumData) {
                for (let key in albumData) {
                    if (albumData[key]) {
                        albumItems.push({
                            id: key, title: albumData[key].title, url: albumData[key].url,
                            type: albumData[key].type || "image", date: albumData[key].date || "未知日期"
                        });
                    }
                }
            }
            renderCalendar();
            renderDayEvents(); renderMainAlbumUI();
            autoCheckAndInjectAllMonthsEvents(); 
        });
    });
}

function renderCalendar(){
    let y = current.getFullYear(); let m = current.getMonth();
    monthLabel.innerText = y + "年 " + (m + 1) + "月";
    let first = new Date(y, m, 1).getDay();
    let days = new Date(y, m + 1, 0).getDate();
    let html = "", total = 0;
    for(let i=0; i<first; i++){ html += `<div class="calendar-day empty"></div>`; total++; }

    for(let i=1; i<=days; i++){
        let dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        let isToday = new Date().toISOString().slice(0,10) === dStr;
        let isSelected = selectedDateStr === dStr;
        let lunarText = getLunarDayText(dStr);
        let holidayText = getHKHoliday(m+1, i);
        
        let dayActivities = activities.filter(a => {
            if (a.isMultiDayEvent && a.multiDayRangeArray) { return a.multiDayRangeArray.includes(dStr); }
            return a.date === dStr;
        });
        let dayMediaItems = albumItems.filter(item => item.date === dStr);
        let belongsToMultiDay = activities.some(act => act.isMultiDayEvent && act.multiDayRangeArray && act.multiDayRangeArray.includes(dStr));
        let eventsHtml = "";
        
        dayActivities.forEach(act => { 
            // 🆕 當切換至「詳細資料」或「開展」視圖時，月曆格子內自動附加顯示負責人
            let inlineMeta = "";
            if ((currentGlobalMode === "詳細資料" || currentGlobalMode === "開展") && act.assignee) {
                inlineMeta = ` (👤${act.assignee})`;
            }
            eventsHtml += `<span class="day-event-badge" title="${act.title}">${act.time} ${act.title}${inlineMeta}</span>`; 
        });
        
        dayMediaItems.forEach(media => {
            eventsHtml = `<span class="day-event-badge" style="background:#fff7e6; color:#d46b08; border-left: 3px solid #f39c12; font-weight:bold;">🖼️ 附圖: ${media.title}</span>` + eventsHtml;
        });
        let dayClass = "calendar-day";
        if (isToday) dayClass += " today";
        if (isSelected) dayClass += " selected-day";
        if (belongsToMultiDay) dayClass += " multiday-pass-range";
        if (holidayText) dayClass += " hk-holiday-pass-range";
        html += `
        <div class="${dayClass}" data-date="${dStr}" onclick="selectDate('${dStr}')">
            <strong>${i}</strong><div class="lunar">${lunarText}</div>
            ${holidayText ? `<div class="holiday">🔴 ${holidayText}</div>` : ""}
            <div class="day-events-container">${eventsHtml}</div>
        </div>`;
        total++;
    }
    while(total % 7 !== 0){ html += `<div class="calendar-day empty"></div>`; total++; }
    calendar.innerHTML = html;
}

function selectDate(dateStr) { selectedDateStr = dateStr; renderCalendar(); renderDayEvents(); renderMainAlbumUI(); }

document.getElementById('popupPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') verifyGatePassword(); });

/* ─── 📋 渲染當日活動日程（新功能：微型智慧晶片標籤排版） ─── */
function renderDayEvents() {
    let container = document.getElementById('dayEvents');
    let filtered = activities.filter(a => {
        if (a.isMultiDayEvent && a.multiDayRangeArray) return a.multiDayRangeArray.includes(selectedDateStr);
        return a.date === selectedDateStr;
    });
    
    document.getElementById('selectedDateLabel').innerText = selectedDateStr;
    
    let dayMedia = albumItems.filter(item => item.date === selectedDateStr);
    if (filtered.length === 0 && dayMedia.length === 0) { container.innerHTML = `<p style="color:gray; text-align:center; padding:20px 0;">今日無 any 排定活動。</p>`; return; }
    
    let html = "";
    filtered.forEach(ev => {
        // 🆕 下方行程卡片動態渲染出多色高質感的元數據晶片 (Meta Chips)
        let chipsHtml = "";
        if (ev.assignee) chipsHtml += `<span class="meta-chip chip-member">👤 負責人: ${ev.assignee}</span>`;
        if (ev.repeat && ev.repeat !== "不重複") chipsHtml += `<span class="meta-chip chip-repeat">🔁 週期: ${ev.repeat}</span>`;
        if (ev.reminder && ev.reminder !== "無") chipsHtml += `<span class="meta-chip chip-reminder">⏰ 提醒: ${ev.reminder}</span>`;

        html += `
        <div class="event-item">
            <div class="event-time">⏰ 時間：${ev.time}</div>
            <div class="event-desc">📌 項目：<strong>${ev.title}</strong></div>
            ${chipsHtml ? `<div class="event-meta-tags">${chipsHtml}</div>` : ""}
        </div>`;
    });
    
    dayMedia.forEach(m => {
        let tag = m.type === "video" ? 
            `<video src="${m.url}" onclick="launchLightboxView('${m.url}', 'video')"></video>` : 
            `<img src="${m.url}" onclick="launchLightboxView('${m.url}', 'image')">`;
            
        // 相簿上傳隨附影像的模擬 AI 標籤
        let mediaAiTag = "🤖 AI標籤: 影像 / 隨附快照";
        if (m.title.includes("二胡") || m.title.includes("課")) mediaAiTag = "🤖 AI標籤: 藝術培訓 / 學習";
        if (m.title.includes("排球")) mediaAiTag = "🤖 AI標籤: 運動 / 比賽紀錄";

        html += `
        <div class="event-item" style="border-left-color: #f39c12; background: #fffdf6;">
            <div class="event-time" style="color:#d46b08;">🖼️ 隨附影像：${m.title}</div>
            <div class="event-meta-tags" style="margin-bottom:6px;"><span class="meta-chip chip-ai">${mediaAiTag}</span></div>
            <div style="margin-top: 6px; width: 140px;">${tag}</div>
        </div>`;
    });
    container.innerHTML = html;
}
