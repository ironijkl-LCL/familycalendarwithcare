            "raw",
            enc.encode(passphrase),
            { name: "PBKDF2" },
            false,
            ["deriveKey"]
        );

        return await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: this.SALT,
                iterations: 100000,
                hash: "SHA-256"
            },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    },

    async initKey(passphrase) {
        if (!passphrase) return;
        this.cachedKey = await this.deriveMasterKey(passphrase);
        sessionStorage.setItem("family_e2ee_active", "true");
    },

    async encrypt(text) {
        if (!text || typeof text !== 'string') return text;
        if (!this.cachedKey) {
            // 未解鎖時使用預設保護金鑰
            await this.initKey("FamilyOS_Lohas_SafeKey_2026");
        }
        try {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(text);
            const ciphertext = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv },
                this.cachedKey,
                encoded
            );

            return {
                is_encrypted: true,
                iv: btoa(String.fromCharCode(...iv)),
                data: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
            };
        } catch (e) {
            return text;
        }
    },

    async decrypt(target) {
        if (!target) return "";
        if (typeof target !== 'object' || !target.is_encrypted) return String(target);
        if (!this.cachedKey) {
            await this.initKey("FamilyOS_Lohas_SafeKey_2026");
        }
        try {
            const iv = Uint8Array.from(atob(target.iv), c => c.charCodeAt(0));
            const ciphertext = Uint8Array.from(atob(target.data), c => c.charCodeAt(0));
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv },
                this.cachedKey,
                ciphertext
            );
            return new TextDecoder().decode(decrypted);
        } catch (e) {
            return "🔒 [加密行程]";
        }
    }
};

// ─── 🛡️ 登入防爆破限制器 (Rate Limiter) ───
const LoginRateLimiter = {
    MAX_ATTEMPTS: 5,
    LOCKOUT_DURATION_MS: 15 * 60 * 1000, // 鎖定 15 分鐘

    checkStatus() {
        const lockUntil = parseInt(localStorage.getItem("family_lockout_time") || "0", 10);
        const now = Date.now();
        if (now < lockUntil) {
            const remainingMins = Math.ceil((lockUntil - now) / 60000);
            return { locked: true, remainingMins };
        }
        return { locked: false };
    },

    recordFailure() {
        let attempts = parseInt(localStorage.getItem("family_login_fail_count") || "0", 10) + 1;
        if (attempts >= this.MAX_ATTEMPTS) {
            localStorage.setItem("family_lockout_time", Date.now() + this.LOCKOUT_DURATION_MS);
            localStorage.setItem("family_login_fail_count", "0");
            return { locked: true, remainingMins: 15 };
        }
        localStorage.setItem("family_login_fail_count", attempts.toString());
        return { locked: false, remainingAttempts: this.MAX_ATTEMPTS - attempts };
    },

    recordSuccess() {
        localStorage.removeItem("family_login_fail_count");
        localStorage.removeItem("family_lockout_time");
    }
};

// 📱 官方 SDK 登入 + 防爆破驗證
async function verifyGatePassword() {
    const lockCheck = LoginRateLimiter.checkStatus();
    if (lockCheck.locked) {
        showToast(`❌ 登入嘗試次數過多，請等待 ${lockCheck.remainingMins} 分鐘後再試`, "error");
        return;
    }

    const inputPwd = document.getElementById('popupPassword').value.trim();
    const btn = document.getElementById('loginSubmitBtn');
    const errBox = document.getElementById('loginErrorMsg');
    errBox.style.display = "none";

    if (!inputPwd) {
        errBox.innerText = "請輸入密碼！";
        errBox.style.display = "block";
        return;
    }

    let emailsToTest = [];
    let memberLabel = "鐵";
    if (isManualEmail) {
        const manual = document.getElementById('manualEmailInput').value.trim();
        emailsToTest = [manual];
    } else {
        const memberKey = document.getElementById('loginMemberSelect').value;
        emailsToTest = CANDIDATE_EMAILS[memberKey] || ["ironijkl@gmail.com"];
        memberLabel = MEMBER_NAME_MAP[memberKey] || "鐵";
    }

    btn.disabled = true;
    btn.innerText = "驗證中...";

    try {
        let authSuccess = false;
        for (const testEmail of emailsToTest) {
            try {
                await window.fbSignIn(window.fbAuth, testEmail, inputPwd);
                authSuccess = true;
                break;
            } catch (authErr) {
                // 嘗試下一組 candidate email
            }
        }

        if (authSuccess) {
            LoginRateLimiter.recordSuccess();
            // 啟用使用者密碼作為 E2EE PBKDF2 密鑰衍生基礎
            await E2EE.initKey(inputPwd);

            applyAdminState(memberLabel);
            showToast(`✓ 歡迎 ${memberLabel}！已進入安全管理模式`, "success");
            document.getElementById('lockSection').style.display = 'none';
            document.getElementById('secureFormPanel').style.display = 'block';
            document.getElementById('eventAssignee').value = memberLabel;
            if (window.startFirebaseSync) window.startFirebaseSync();
        } else {
            const failStatus = LoginRateLimiter.recordFailure();
            if (failStatus.locked) {
                errBox.innerText = "❌ 密碼錯誤已達 5 次，系統已鎖定 15 分鐘！";
            } else {
                errBox.innerText = `❌ 密碼不正確！剩餘嘗試次數：${failStatus.remainingAttempts}`;
            }
            errBox.style.display = "block";
        }
    } catch (e) {
        errBox.innerText = "❌ 連線異常：" + e.message;
        errBox.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.innerText = "登入驗證";
    }
}

// 📱 Apple 必審：In-App 刪除帳號 (Account Deletion)
async function handleDeleteAccount() {
    const user = window.fbAuth?.currentUser;
    if (!user) {
        alert("目前尚未登入任何帳號！");
        return;
    }

    const firstConfirm = confirm("⚠️ 警告：刪除帳號是不可逆的操作！\n此操作將永久註銷您的登入權限並刪除個人設定。確定要繼續嗎？");
    if (!firstConfirm) return;

    const confirmPassword = prompt("為了安全起見，請輸入您的密碼以確認刪除帳號：");
    if (!confirmPassword) return;

    showToast("正在註銷並刪除帳號...", "normal");

    try {
        const credential = window.fbEmailAuthProvider.credential(user.email, confirmPassword);
        await window.fbReauth(user, credential);

        if (currentUserMemberName && window.fbDb && window.fbRef && window.fbRemove) {
            await window.fbRemove(window.fbRef(window.fbDb, `family_members/${currentUserMemberName}`));
        }

        await window.fbDeleteUser(user);

        localStorage.clear();
        sessionStorage.clear();
        renderUnauthenticatedState();
        closeEventPopup();

        alert("您的帳號已成功永久刪除。");
        location.reload();
    } catch (error) {
        if (error.code === "auth/wrong-password") {
            alert("密碼不正確，刪除操作已中止。");
        } else {
            alert("刪除帳號失敗：" + error.message);
        }
    }
}

async function addFamilyEvent() {
    let rawTitle = document.getElementById('eventTitle').value.trim();
    let startVal = document.getElementById('eventTime').value.trim();
    let endVal = document.getElementById('eventEndTime').value.trim();
    let assignee = document.getElementById('eventAssignee').value;
    let chosenCategory = document.getElementById('eventCategory').value;

    if (!rawTitle || !startVal) {
        alert("請填寫活動名稱與開始時間！");
        return;
    }

    let detectedDate = startVal.split(' ')[0] || selectedDateStr;
    let detectedEndDate = endVal ? (endVal.split(' ')[0] || detectedDate) : detectedDate;
    let timeLabel = startVal.split(' ')[1] || "20:30";
    if (endVal) timeLabel = `${timeLabel} ~ ${endVal.split(' ')[1] || endVal}`;

    const newId = "local_" + Date.now();
    
    // 1. 本地樂觀更新（0 毫秒即刻渲染）
    const localActivityObj = {
        id: newId,
        date: detectedDate,
        endDate: detectedEndDate,
        time: timeLabel,
        title: rawTitle,
        assignee: assignee,
        category: chosenCategory,
        status: "待處理"
    };

    activities.unshift(localActivityObj);
    localStorage.setItem('family_cached_activities', JSON.stringify(activities));
    
    triggerPipelineRefresh();
    showToast(`✓ 已成功新增「${rawTitle}」！`, "success");
    
    closeEventPopup();
    document.getElementById('eventTitle').value = "";

    // 2. 雲端真 E2EE 加密儲存
    try {
        const encryptedTitle = await E2EE.encrypt(rawTitle);
        const payload = {
            title: encryptedTitle,
            date: detectedDate,
            endDate: detectedEndDate,
            time: timeLabel,
            assignee: assignee,
            category: chosenCategory,
            status: "待處理",
            updatedAt: Date.now()
        };

        if (window.fbDb && window.fbRef && window.fbPush) {
            const newRef = window.fbPush(window.fbRef(window.fbDb, "family_calendar_activities"));
            await window.fbSet(newRef, payload);
        }
    } catch (err) {
        console.warn("雲端背景同步延遲，已保留本地版本:", err);
    }
}

function isEventActiveOnDate(event, dateStr) {
    if (!event || !event.date) return false;
    let start = String(event.date).split(' ')[0];
    let end = String(event.endDate || event.date).split(' ')[0];
    return (dateStr >= start && dateStr <= end);
}

function triggerPipelineRefresh() {
    let dataset = activities;
    if (isPersonalOnly && currentUserMemberName) {
        dataset = activities.filter(a => a.assignee === currentUserMemberName || a.assignee === "全員");
    }
    renderCalendarWithData(dataset);
}

function renderCalendarWithData(dataset) {
    let y = current.getFullYear();
    let m = current.getMonth();
    document.getElementById('monthLabel').innerText = `${y}年 ${m + 1}月`;
    
    let firstDayIndex = new Date(y, m, 1).getDay();
    let daysCount = new Date(y, m + 1, 0).getDate();
    let todayDateStr = formatLocalDate(new Date());
    let fragment = document.createDocumentFragment();

    for (let i = 0; i < firstDayIndex; i++) {
        let cell = document.createElement('div');
        cell.className = "calendar-day empty";
        fragment.appendChild(cell);
    }

    for (let i = 1; i <= daysCount; i++) {
        let dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        let isToday = (todayDateStr === dStr);
        let isSelected = (selectedDateStr === dStr);

        let dayActivities = dataset.filter(a => isEventActiveOnDate(a, dStr));
        let eventsHtml = "";

        dayActivities.forEach(act => {
            eventsHtml += `<span class="day-event-badge" style="background:rgba(0,113,227,0.12); color:#0071e3; border-left:3px solid #0071e3;">${act.time} ${DOMPurify.sanitize(act.title)}</span>`;
        });

        let dayCell = document.createElement('div');
        dayCell.className = "calendar-day" + (isToday ? " today" : "") + (isSelected ? " selected-day" : "");
        dayCell.onclick = () => selectDate(dStr);

        dayCell.innerHTML = `<strong>${i}</strong><div class="day-events-container">${eventsHtml}</div>`;
        fragment.appendChild(dayCell);
    }

    const cal = document.getElementById('calendar');
    cal.innerHTML = "";
    cal.appendChild(fragment);
    renderDayEvents(dataset);
}

function selectDate(dateStr) {
    selectedDateStr = dateStr;
    document.getElementById('selectedDateLabel').innerText = selectedDateStr;
    triggerPipelineRefresh();
}

function renderDayEvents(dataset) {
    let container = document.getElementById('dayEvents');
    let filtered = dataset.filter(a => isEventActiveOnDate(a, selectedDateStr));
    if (filtered.length === 0) {
        container.innerHTML = `<p style="color:var(--apple-text-secondary); text-align:center; padding:15px 0; font-size:14px;">此日暫無行程。</p>`;
        return;
    }
    let html = "";
    filtered.forEach(ev => {
        html += `<div class="event-item"><div class="event-time">⏰ ${ev.time}</div><div class="event-desc">📌 <strong>${DOMPurify.sanitize(ev.title)}</strong></div><div class="event-meta-tags"><span style="font-size:11px; padding:3px 8px; border-radius:16px; font-weight:600; background:#e5f1ff; color:#0071e3;">${ev.category || '家庭'}</span><span style="font-size:11px; padding:3px 8px; border-radius:16px; font-weight:600; background:#eef9f0; color:#28a745;">👤 ${ev.assignee || '全員'}</span></div></div>`;
    });
    container.innerHTML = html;
}

function sendTodayWhatsApp() {
    let evs = activities.filter(a => isEventActiveOnDate(a, selectedDateStr));
    if (evs.length === 0) {
        alert("所選日期沒有任何行程可發送！");
        return;
    }
    let text = `💡【麟李家庭智慧日程 - ${selectedDateStr}】\n\n`;
    evs.forEach((e, idx) => {
        text += `${idx + 1}. ⏰ ${e.time} - ${e.title} (👤 ${e.assignee})\n`;
    });
    text += `\n請大家留意時間！❤️`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
}
