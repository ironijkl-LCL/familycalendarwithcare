<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0071e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="麟李家庭智慧管理系統 - 結合 Dify AI 雲端分類、香港紅日、農曆、原生選取器與即時同步日曆">
<title>Family OS - 麟李家庭智慧管理系統</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root {
    --apple-bg: #f2f2f7;
    --apple-card: #ffffff;
    --apple-text: #1c1c1e;
    --apple-text-secondary: #8e8e93;
    --apple-border: rgba(60, 60, 67, 0.12);
    --oasis-primary: #0071e3;
    --oasis-success: #34c759;
    --oasis-danger: #ff3b30;
    --oasis-warning: #ff9500;
    --oasis-ai-gradient: linear-gradient(135deg, rgba(232, 220, 255, 0.65), rgba(212, 235, 255, 0.65));
    --oasis-ai-purple: #7d2ae8;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: var(--apple-bg);
    color: var(--apple-text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

input, textarea, select { font-size: 16px !important; }

/* ─── 頂部導航列 ─── */
header {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: 8px;
    padding-left: 16px;
    padding-right: 16px;
    border-bottom: 1px solid var(--apple-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}
.header-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.header-status-group { display: flex; align-items: center; gap: 6px; }

.auth-badge {
    font-size: 12px;
    background: rgba(0, 0, 0, 0.05);
    padding: 4px 10px;
    border-radius: 14px;
    font-weight: 600;
    color: var(--apple-text-secondary);
    border: none;
    cursor: pointer;
}
.auth-badge.logged-in {
    background: rgba(52, 199, 89, 0.12);
    color: var(--oasis-success);
}
.logout-btn {
    font-size: 12px;
    color: var(--oasis-danger);
    background: none;
    border: none;
    font-weight: 600;
    cursor: pointer;
    display: none;
    padding: 4px;
}

/* ─── 主畫面佈局 ─── */
.main-layout {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 8px 12px max(12px, env(safe-area-inset-bottom)) 12px;
    gap: 8px;
}

/* 🎯 頂部四大功能操作鍵 */
.top-action-bar {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}
.top-action-bar button {
    flex: 1;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    transition: transform 0.1s;
    white-space: nowrap;
}
.top-action-bar button:active { transform: scale(0.97); opacity: 0.9; }
.btn-green { background: #34c759; }
.btn-blue { background: #0071e3; }
.btn-wallpaper { background: #5856d6; }

/* 🔮 麟李 AI 家庭日誌雷達 */
.ai-summary-pill {
    background: var(--oasis-ai-gradient);
    border: 1px solid rgba(125, 42, 232, 0.2);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}
.ai-pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--oasis-ai-purple);
    display: inline-block;
    margin-right: 4px;
    animation: aiPulse 1.6s infinite ease-in-out;
}
@keyframes aiPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; transform: scale(1.2); } }

/* ✨ 廣東話自然語言極速輸入條 */
.ai-nlp-quick-bar {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    background: #ffffff;
    padding: 3px 6px;
    border-radius: 10px;
    border: 1px solid var(--apple-border);
}
.ai-nlp-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 6px 8px;
    font-size: 13px !important;
    outline: none;
    color: var(--apple-text);
}
.ai-nlp-btn {
    background: var(--oasis-ai-purple);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

/* 🗓️ 上層：月曆卡片 */
.calendar-card {
    background: var(--apple-card);
    border-radius: 14px;
    padding: 8px 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    border: 1px solid var(--apple-border);
    flex: 1.35;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.calendar-nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    flex-shrink: 0;
}
.nav-arrow-btn {
    background: rgba(0, 0, 0, 0.04);
    border: none;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
}
.current-month-label { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }

.weekdays-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--apple-text-secondary);
    padding-bottom: 3px;
    flex-shrink: 0;
}
.weekdays-row .sunday { color: var(--oasis-danger); }

.days-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 3px;
    overflow-y: auto;
}
.days-grid::-webkit-scrollbar { display: none; }

.day-cell {
    background: rgba(0, 0, 0, 0.015);
    border-radius: 8px;
    padding: 2px 2px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    cursor: pointer;
    overflow: hidden;
    border: 1px solid transparent;
    transition: background 0.12s ease;
}
.day-cell:active { background: rgba(0, 0, 0, 0.05); }
.day-cell.empty { background: transparent !important; pointer-events: none; }

.day-cell.today { border: 1.5px solid var(--oasis-warning); }
.day-cell.today .day-number { color: var(--oasis-warning); font-weight: 800; }
.day-cell.selected {
    background: rgba(0, 113, 227, 0.08) !important;
    border-color: var(--oasis-primary) !important;
}
.day-cell.selected .day-number {
    background: var(--oasis-primary);
    color: #ffffff !important;
    border-radius: 10px;
    padding: 0 4px;
}

.day-cell-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 1px;
    line-height: 1.1;
}
.day-number { font-size: 11.5px; font-weight: 700; }
.day-cell.is-holiday .day-number,
.day-cell.is-sunday .day-number { color: var(--oasis-danger); }

.day-lunar { font-size: 8.5px; color: var(--apple-text-secondary); transform: scale(0.85); transform-origin: right center; }
.day-holiday {
    font-size: 8px;
    color: var(--oasis-danger);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transform: scale(0.85);
    transform-origin: left center;
}

.day-events-text-box {
    display: flex;
    flex-direction: column;
    gap: 1.5px;
    margin-top: 1px;
    overflow: hidden;
    flex: 1;
}
.calendar-event-chip {
    font-size: 8.5px;
    line-height: 1.15;
    padding: 1px 3px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
}

/* 📋 下層：當日焦點活動清單（完全連動與權限隔離） */
.agenda-card {
    background: var(--apple-card);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    border: 1px solid var(--apple-border);
    flex: 0.95;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.agenda-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--apple-border);
    flex-shrink: 0;
}
.agenda-date-title { font-size: 14px; font-weight: 700; }
.agenda-actions { display: flex; gap: 6px; align-items: center; }
.agenda-quick-btn {
    background: rgba(0, 113, 227, 0.08);
    color: var(--oasis-primary);
    border: none;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
}

.agenda-list {
    flex: 1;
    overflow-y: auto;
    padding-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.agenda-list::-webkit-scrollbar { display: none; }

.event-row-card {
    background: rgba(0, 0, 0, 0.02);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left-width: 4px;
    border-left-style: solid;
}
.event-info { display: flex; flex-direction: column; gap: 2px; }
.event-time-badge { font-size: 11px; font-weight: 700; }
.event-title-text { font-size: 13.5px; font-weight: 600; color: var(--apple-text); }
.event-meta-tags { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.tag-pill {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.05);
    color: var(--apple-text-secondary);
    font-weight: 600;
}
.ai-tag-chip {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(125, 42, 232, 0.1);
    color: var(--oasis-ai-purple);
    font-weight: 600;
}
.assignee-chip {
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
}
.ai-priority-badge {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(255, 59, 48, 0.12);
    color: var(--oasis-danger);
    font-weight: 700;
}

.empty-agenda-view { text-align: center; padding: 20px 0; color: var(--apple-text-secondary); font-size: 13px; }

/* ─── 彈出視窗 ─── */
.popup-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 2000;
    justify-content: center;
    align-items: center;
}
.popup-card {
    background: #ffffff;
    width: 90%;
    max-width: 440px;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    box-sizing: border-box;
    position: relative;
    max-height: 88vh;
    overflow-y: auto;
}
.popup-close-x {
    position: absolute;
    top: 14px; right: 16px;
    font-size: 22px;
    color: var(--apple-text-secondary);
    border: none;
    background: none;
    cursor: pointer;
}

.form-label { font-size: 13px; font-weight: 600; color: var(--apple-text-secondary); margin-top: 8px; display: block; }
.form-input {
    width: 100%;
    padding: 10px 12px;
    margin: 4px 0 6px;
    border: 1px solid var(--apple-border);
    border-radius: 10px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.02);
    outline: none;
    color: var(--apple-text);
}
.form-input:focus { border-color: var(--oasis-primary); background: #ffffff; }

.native-picker-row {
    display: flex;
    gap: 8px;
    margin: 4px 0 6px;
}
.native-picker-row input[type="date"] {
    flex: 1.4;
    padding: 10px 12px;
    border: 1px solid var(--apple-border);
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.02);
    font-family: inherit;
    color: var(--apple-text);
    outline: none;
}
.native-picker-row input[type="time"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--apple-border);
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.02);
    font-family: inherit;
    color: var(--apple-text);
    outline: none;
}
.native-picker-row input:focus { border-color: var(--oasis-primary); background: #ffffff; }

.dify-auto-btn {
    background: rgba(125, 42, 232, 0.1);
    color: var(--oasis-ai-purple);
    border: 1px solid rgba(125, 42, 232, 0.25);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.submit-btn-block {
    width: 100%;
    padding: 12px;
    background: var(--oasis-primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}
.submit-btn-block:active { opacity: 0.85; }

/* ─── HIG 自訂對話框 ─── */
.hig-dialog-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
    z-index: 10000;
    justify-content: center;
    align-items: center;
}
.hig-dialog-card {
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(20px);
    width: 270px;
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.hig-dialog-header { padding: 16px 14px 10px; }
.hig-dialog-title { font-size: 16px; font-weight: 600; margin: 0; }
.hig-dialog-msg { font-size: 13px; color: var(--apple-text-secondary); margin-top: 4px; }
.hig-dialog-input {
    width: 86%; margin: 6px auto 12px; padding: 6px 8px;
    border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; box-sizing: border-box; display: block;
}
.hig-dialog-actions { display: flex; border-top: 1px solid rgba(0,0,0,0.08); }
.hig-dialog-btn {
    flex: 1; background: none; border: none; padding: 11px 0;
    font-size: 15px; color: var(--oasis-primary); cursor: pointer;
}
.hig-dialog-btn.cancel { border-right: 1px solid rgba(0,0,0,0.08); color: var(--apple-text-secondary); }
.hig-dialog-btn.destructive { color: var(--oasis-danger); font-weight: 600; }
</style>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
  import { 
    initializeAuth, browserLocalPersistence, inMemoryPersistence, getAuth, 
    signInWithEmailAndPassword, signOut, deleteUser, reauthenticateWithCredential, 
    EmailAuthProvider, onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, onValue, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAasqW8TgacCLLNuhg_I1ItVQlDfAHatc0",
    authDomain: "familycalender-a62ae.firebaseapp.com",
    databaseURL: "https://familycalender-a62ae-default-rtdb.firebaseio.com",
    projectId: "familycalender-a62ae",
    storageBucket: "familycalender-a62ae.firebasestorage.app",
    messagingSenderId: "161867987572",
    appId: "1:161867987572:web:ee6641980baaf9cd78ef21"
  };

  const app = initializeApp(firebaseConfig);

  if (location.hostname === "localhost" || location.protocol === "capacitor:") {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
  }

  try {
      initializeAppCheck(app, {
          provider: new ReCaptchaEnterpriseProvider('6LcD6cQtAAAAAB0OQG6JElGlxF3qbvlg_X8lr1Ln'),
          isTokenAutoRefreshEnabled: true
      });
  } catch (e) {}

  let auth;
  try {
      auth = initializeAuth(app, { persistence: [browserLocalPersistence, inMemoryPersistence] });
  } catch (e) {
      auth = getAuth(app);
  }

  const db = getDatabase(app);

  window.fbAuth = auth;
  window.fbSignIn = signInWithEmailAndPassword;
  window.fbSignOut = signOut;
  window.fbDeleteUser = deleteUser;
  window.fbReauth = reauthenticateWithCredential;
  window.fbEmailAuthProvider = EmailAuthProvider;
  window.fbDb = db;
  window.fbRef = ref;
  window.fbOnValue = onValue;
  window.fbSet = set;
  window.fbPush = push;
  window.fbUpdate = update;
  window.fbRemove = remove;

  onAuthStateChanged(auth, async (user) => {
      if (user) {
          const email = user.email || "";
          let memberName = "鐵";
          if (email.includes("daddy")) memberName = "Daddy";
          else if (email.includes("mummy")) memberName = "Mummy";
          else if (email.includes("jolie")) memberName = "Jolie";
          else if (email.includes("leisel")) memberName = "蓓";
          else if (email.includes("karis")) memberName = "熹";

          applyLoginState(memberName);
          window.startFirebaseSync();
      } else {
          renderGuestState();
      }
  });

  window.startFirebaseSync = function() {
      if (!window.fbDb || !window.fbRef || !window.fbOnValue) return;
      const actRef = window.fbRef(window.fbDb, "family_calendar_activities");
      window.fbOnValue(actRef, async (snapshot) => {
          const data = snapshot.val();
          const list = [];
          if (data) {
              for (let key in data) {
                  const item = data[key];
                  const title = await E2EE.decrypt(item.title);
                  list.push({
                      id: key,
                      date: item.date || "",
                      time: item.time || "20:00",
                      title: title || "活動",
                      assignee: item.assignee || "全員",
                      category: item.category || "家庭",
                      isAI_Priority: item.isAI_Priority || false,
                      ai_tags: item.ai_tags || [],
                      urgency_score: item.urgency_score || 0
                  });
              }
          }
          if (list.length > 0) {
              activities = list;
              localStorage.setItem('family_cached_activities', JSON.stringify(activities));
              renderCalendar();
              renderAgenda();
              updateAISummary();
          }
      }, (err) => {
          console.warn("RTDB 同步狀態:", err.code);
      });
  };
</script>
</head>

<body>

<header>
    <div class="header-title">🏠 Family OS</div>
    <div class="header-status-group">
        <button id="authBadgeBtn" class="auth-badge" onclick="handleAuthBadgeClick()">🔒 訪客模式</button>
        <button id="logoutBtn" class="logout-btn" onclick="logoutAccount()">登出</button>
    </div>
</header>

<div class="main-layout">

    <!-- 🎯 頂部四大功能操作鍵（含新增鎖屏壁紙按鈕） -->
    <div class="top-action-bar">
        <button class="btn-green" onclick="handleTopAddClick()">➕ 活動</button>
        <button class="btn-blue" onclick="handleTopManageClick()">⚙️ 修改/刪除</button>
        <button class="btn-green" onclick="shareWhatsApp()">💬 WHATSAPP</button>
        <button class="btn-wallpaper" onclick="generateLockScreenWallpaper()">📱 鎖屏壁紙</button>
    </div>

    <!-- 🔮 麟李 AI 家庭日誌雷達 -->
    <div class="ai-summary-pill" id="aiSummaryPill">
        <div><span class="ai-pulse-dot"></span><strong style="color:var(--oasis-ai-purple);">AI 雷達：</strong><span id="aiStrainText">今日節奏平穩，暫無急件衝突</span></div>
        <span id="aiPendingBadge" style="font-weight:700; color:var(--oasis-primary);">0 項重點</span>
    </div>

    <!-- ✨ 廣東話自然語言極速輸入條 -->
    <div class="ai-nlp-quick-bar">
        <input type="text" id="aiQuickInput" class="ai-nlp-input" placeholder="✨ 試試輸入：聽晚八點半同嫲嫲仁安覆診...">
        <button class="ai-nlp-btn" onclick="executeAINaturalInput()">AI 排程</button>
    </div>

    <!-- 🗓️ 上層：月曆卡片（完整排版 + 成員專屬色文字標籤） -->
    <div class="calendar-card">
        <div class="calendar-nav-bar">
            <button class="nav-arrow-btn" onclick="changeMonthOffset(-1)">⬅ 上一月</button>
            <div id="calendarMonthLabel" class="current-month-label">2026年 9月</div>
            <button class="nav-arrow-btn" onclick="changeMonthOffset(1)">下一月 ➡</button>
        </div>
        <div class="weekdays-row">
            <div class="sunday">日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>

function escapeHtml(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getSafeTitle(rawTitle) {

}

// ─── 🛡️ 安全 E2EE 保險庫 ───
const E2EE = {
    cachedKey: null,
    async getKey() {
        if (this.cachedKey) return this.cachedKey;
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey(
            "raw", enc.encode("Lohas_Family_Vault_Passphrase_2026"), { name: "PBKDF2" }, false, ["deriveKey"]
        );
        this.cachedKey = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: enc.encode("FamilySaltSecured"), iterations: 100000, hash: "SHA-256" },
            baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
        return this.cachedKey;
    },
    async encrypt(text) {
        if (!text) return "";
        try {
            const key = await this.getKey();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(String(text)));
            return {
                is_encrypted: true,
                iv: btoa(String.fromCharCode(...iv)),
                data: btoa(String.fromCharCode(...new Uint8Array(cipher)))
            };
        } catch(e) { return String(text); }
    },
    async decrypt(obj) {
        if (!obj) return "";
        if (typeof obj !== 'object' || !obj.is_encrypted) return String(obj || "");
        try {
            const key = await this.getKey();
            const iv = Uint8Array.from(atob(obj.iv), c => c.charCodeAt(0));
            const data = Uint8Array.from(atob(obj.data), c => c.charCodeAt(0));
            const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
            return new TextDecoder().decode(plain);
        } catch(e) { return "🔒 行程"; }
    }
};

function formatDayStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getLunarDayText(dateStr) {
    try {
        const parts = dateStr.split('-');
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12);
        const formatter = new Intl.DateTimeFormat("zh-Hant-u-ca-chinese", { day: "numeric" });
        const str = formatter.format(d);
        const val = parseInt(str.replace(/\D/g, ''), 10);
        if (isNaN(val)) return "";
        const CN = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
        if (val === 1) return "初一";
        if (val <= 10) return "初" + CN[val];
        if (val < 20) return "十" + CN[val - 10];
        if (val === 20) return "二十";
        if (val < 30) return "廿" + CN[val - 20];
        return "三十";
    } catch (e) { return ""; }
}

// 狀態管理

// ─── 🗓️ 核心月曆排版渲染 ───
function renderCalendar() {
    const y = currentMonthDate.getFullYear();
    const m = currentMonthDate.getMonth();
    document.getElementById('calendarMonthLabel').innerText = `${y}年 ${m + 1}月`;

    const firstDayIndex = new Date(y, m, 1).getDay();
    const totalDays = new Date(y, m + 1, 0).getDate();
    const todayStr = formatDayStr(new Date());

    const grid = document.getElementById('daysGridNode');
    grid.innerHTML = "";

    for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        grid.appendChild(emptyCell);
    }

    for (let day = 1; day <= totalDays; day++) {
        const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = new Date(y, m, day).getDay();
        const isHoliday = HK_HOLIDAYS[dStr] !== undefined;
        const isSunday = dayOfWeek === 0;
        const isToday = dStr === todayStr;
        const isSelected = dStr === selectedDateStr;

        const cell = document.createElement('div');
        cell.className = `day-cell ${isSunday ? 'is-sunday' : ''} ${isHoliday ? 'is-holiday' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
        cell.onclick = () => selectDate(dStr);

        let eventChipsHtml = "";
        try {
            const dayActs = activities.filter(a => a && a.date === dStr);
            if (dayActs.length > 0) {
                eventChipsHtml = `<div class="day-events-text-box">${dayActs.slice(0, 2).map(act => {
                    const safeTitle = getSafeTitle(act.title);
                    const timePart = (typeof act.time === 'string') ? act.time.split(' ')[0] : '';
                    const theme = getMemberTheme(act.assignee);
                    return `
                        <div class="calendar-event-chip" style="background:${theme.bg}; color:${theme.color}; border-left: 2px solid${theme.border};" title="${safeTitle} (${act.assignee})">
                            ${timePart}${safeTitle}
                        </div>
                    `;
                }).join('')}${dayActs.length > 2 ? `<div style="font-size:8px; color:var(--oasis-primary); font-weight:bold; line-height:1;">+${dayActs.length - 2}</div>` : ''}</div>`;
            }
        } catch (e) {
            console.warn("Event chip error on day", day, e);
        }

        const holidayText = HK_HOLIDAYS[dStr] ? `<div class="day-holiday">${HK_HOLIDAYS[dStr]}</div>` : '';
        const lunarText = !HK_HOLIDAYS[dStr] ? `<div class="day-lunar">${getLunarDayText(dStr)}</div>` : '';

        cell.innerHTML = `
            <div class="day-cell-top">
                <span class="day-number">${day}</span>
                ${lunarText}
            </div>
            ${holidayText}
            ${eventChipsHtml}
        `;
        grid.appendChild(cell);
    }
}

function selectDate(dStr) {
    selectedDateStr = dStr;
    renderCalendar();
    renderAgenda();
}

// ─── 📋 當日焦點行程清單（嚴格執行權限隔離） ───
function renderAgenda() {
    const listNode = document.getElementById('agendaListNode');
    const titleNode = document.getElementById('agendaDateTitle');
    const actionsNode = document.getElementById('agendaActionsNode');

    const parts = selectedDateStr.split('-');
    const holidayName = HK_HOLIDAYS[selectedDateStr] ? ` (${HK_HOLIDAYS[selectedDateStr]})` : '';
    const lunarName = !HK_HOLIDAYS[selectedDateStr] ? ` (${getLunarDayText(selectedDateStr)})` : '';
    titleNode.innerText = `📋 ${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日 行程${holidayName || lunarName}`;

    // 🔒 訪客模式：右上角顯示唯讀標籤，不提供「➕ 新增」按鈕
    if (actionsNode) {
        actionsNode.innerHTML = isGuest 
            ? `<span style="font-size:11px; color:var(--apple-text-secondary); font-weight:600; padding:4px 8px; background:rgba(0,0,0,0.04); border-radius:6px;">🔒 唯讀模式</span>`
            : `<button class="agenda-quick-btn" onclick="openAddModal('ADD')">➕ 新增</button>`;
    }

    const matched = activities.filter(a => a && a.date === selectedDateStr);
    if (matched.length === 0) {
        listNode.innerHTML = `<div class="empty-agenda-view">${isGuest ? '此日暫無排定活動。' : '此日暫無排定活動，點擊右上角「➕ 新增」記錄'}</div>`;
        return;
    }

    listNode.innerHTML = matched.map(item => {
        const safeTitle = getSafeTitle(item.title);
        const theme = getMemberTheme(item.assignee);
        const aiTagsHtml = (item.ai_tags && item.ai_tags.length > 0) 
            ? item.ai_tags.map(t => `<span class="ai-tag-chip">#${escapeHtml(t)}</span>`).join('') 
            : '';

        // 🔒 訪客模式下「修改」與「刪除」按鈕徹底不渲染
        const actionButtonsHtml = isGuest ? '' : `
            <div>
                <button onclick="openEditSpecificItem('${item.id}')" style="background:none; border:none; color:var(--oasis-primary); font-size:12px; font-weight:700; cursor:pointer; margin-right:6px;">修改</button>
                <button onclick="deleteEventItem('${item.id}')" style="background:none; border:none; color:var(--oasis-danger); font-size:12px; font-weight:700; cursor:pointer;">刪除</button>
            </div>
        `;

        return `
            <div class="event-row-card" style="border-left-color: ${theme.border};">
                <div class="event-info">
                    <span class="event-time-badge" style="color:${theme.color};">⏰ ${item.time || '全日'}</span>
                    <span class="event-title-text">${safeTitle}</span>
                    <div class="event-meta-tags">
                        <span class="assignee-chip" style="background:${theme.bg}; color:${theme.color}; border:1px solid ${theme.border};">
                            ${theme.icon} ${item.assignee || '全員'}
                        </span>
                        <span class="tag-pill">${item.category || '家庭'}</span>
                        ${aiTagsHtml}
                        ${item.isAI_Priority ? '<span class="ai-priority-badge">🔥 高優先</span>' : ''}
                    </div>
                </div>
                ${actionButtonsHtml}
            </div>
        `;
    }).join('');
}

// ─── 🔮 智慧家庭雷達 ───
function updateAISummary() {
    const todayStr = formatDayStr(new Date());
    const todayActs = activities.filter(a => a && a.date === todayStr);
    const urgentActs = activities.filter(a => a && (a.isAI_Priority || a.category === "重要" || a.category === "醫療健康"));

    const strainScore = todayActs.length + (urgentActs.length * 2);
    const textEl = document.getElementById('aiStrainText');
    const badgeEl = document.getElementById('aiPendingBadge');

    badgeEl.innerText = `${urgentActs.length} 項重點`;

    if (strainScore >= 6) {
        textEl.innerHTML = `<span style="color:var(--oasis-danger); font-weight:bold;">家庭負載偏高</span>（多項醫療/重點行程疊加，建議分流）`;
    } else if (strainScore >= 3) {
        textEl.innerHTML = `<span style="color:var(--oasis-warning); font-weight:bold;">事務節奏適中</span>（請留意長輩接送與覆診時間）`;
    } else {
        textEl.innerText = `家庭步調輕鬆，今日安排順暢`;
    }
}

// ─── 📱 生成專屬 iPhone 鎖定畫面海報壁紙 ───
async function generateLockScreenWallpaper() {
    const canvas = document.createElement('canvas');
    canvas.width = 1170;
    canvas.height = 2532;
    const ctx = canvas.getContext('2d');

    // 1. 深色質感漸層背景（保護電力且字體清晰）
    const bgGrad = ctx.createLinearGradient(0, 0, 0, 2532);
    bgGrad.addColorStop(0, "#0d0d10");
    bgGrad.addColorStop(0.5, "#16161a");
    bgGrad.addColorStop(1, "#1c1c22");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. 避開頂部原生 iOS 時鐘區（從 Y: 640px 開始繪製）
    let startY = 640;

    // 3. 繪製日期與農曆標題
    const dayActs = activities.filter(a => a && a.date === selectedDateStr);
    const parts = selectedDateStr.split('-');
    const holiday = HK_HOLIDAYS[selectedDateStr] || "";
    const lunar = getLunarDayText(selectedDateStr);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 80px -apple-system, sans-serif";
    ctx.fillText(`${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日`, 100, startY);

    ctx.fillStyle = holiday ? "#ff453a" : "#8e8e93";
    ctx.font = "600 44px -apple-system, sans-serif";
    ctx.fillText(`${holiday || lunar} · 家庭日程`, 100, startY + 76);

    // 4. 繪製精緻分隔線
    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(100, startY + 124);
    ctx.lineTo(1070, startY + 124);
    ctx.stroke();

    // 5. 逐項繪製活動卡片
    let cardY = startY + 180;
    if (dayActs.length === 0) {
        ctx.fillStyle = "#8e8e93";
        ctx.font = "42px -apple-system, sans-serif";
        ctx.fillText("今日暫無排定行程，步調輕鬆。❤️", 100, cardY + 70);
    } else {
        dayActs.forEach((act, idx) => {
            if (idx > 4) return; // 鎖定畫面最多顯示 5 項重點

            const theme = getMemberTheme(act.assignee);

            // 卡片磨砂半透明背景
            ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
            if (ctx.roundRect) {
                ctx.roundRect(100, cardY, 970, 160, 24);
            } else {
                ctx.rect(100, cardY, 970, 160);
            }
            ctx.fill();

            // 成員專屬色左邊框
            ctx.fillStyle = theme.border;
            if (ctx.roundRect) {
                ctx.roundRect(100, cardY, 18, 160, [24, 0, 0, 24]);
            } else {
                ctx.rect(100, cardY, 18, 160);
            }
            ctx.fill();

            // 時間
            ctx.fillStyle = theme.color;
            ctx.font = "bold 38px -apple-system, sans-serif";
            ctx.fillText(`⏰ ${act.time || '全日'}`, 150, cardY + 62);

            // 行程名稱
            ctx.fillStyle = "#ffffff";
            ctx.font = "600 44px -apple-system, sans-serif";
            const safeTitle = getSafeTitle(act.title);
            const titleTxt = safeTitle.length > 15 ? safeTitle.slice(0, 15) + '...' : safeTitle;
            ctx.fillText(titleTxt, 150, cardY + 122);

            // 負責人膠囊標籤
            ctx.fillStyle = theme.bg;
            if (ctx.roundRect) {
                ctx.roundRect(870, cardY + 45, 170, 70, 16);
            } else {
                ctx.rect(870, cardY + 45, 170, 70);
            }
            ctx.fill();

            ctx.fillStyle = theme.color;
            ctx.font = "bold 32px -apple-system, sans-serif";
            ctx.fillText(`${theme.icon} ${act.assignee}`, 895, cardY + 92);

            cardY += 194;
        });
    }

    // 6. 輸出為高清圖片並拉起原生分享/儲存
    canvas.toBlob(blob => {
        const file = new File([blob], `FamilyOS_Wallpaper_${selectedDateStr}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                title: 'Family OS 今日鎖屏壁紙',
                text: '儲存圖片並設為鎖定畫面壁紙，一眼掌握全家行程！',
                files: [file]
            });
        } else {
            const link = document.createElement('a');
            link.download = `FamilyOS_Wallpaper_${selectedDateStr}.png`;
            link.href = canvas.toDataURL();
            link.click();
            HIG.alert("壁紙已生成", "圖片已下載！請至相簿選取圖片並設定為手機鎖定畫面壁紙。");
        }
    });
}

// ─── 🤖 Dify 雲端智慧填充 ───
async function triggerDifyAutoFill() {
    const title = document.getElementById('formEventTitle').value.trim();
    if (!title) return;

    let category = "家庭";
    let isPriority = false;
    let tags = [];
    let score = 20;

    if (/覆診|醫院|診所|醫生|抽血|仁安|量血壓|食藥/.test(title)) {
        category = "醫療健康";
        isPriority = true;
        tags = ["醫療護理", "長輩健康"];
        score = 90;
    } else if (/運動|排球|打波|游水|健身/.test(title)) {
        category = "體育運動";
        tags = ["體能鍛鍊"];
        score = 40;
    } else if (/考試|二胡|功課|返學|家長會/.test(title)) {
        category = "學校";
        isPriority = true;
        tags = ["學業重點"];
        score = 75;
    } else if (/會議|出差|見客|簽約/.test(title)) {
        category = "工作";
        tags = ["工作要事"];
        score = 60;
    } else if (/生日|節禮|食飯|Dinner|聚會/.test(title)) {
        category = "家庭";
        tags = ["家庭聚餐"];
        score = 30;
    }

    document.getElementById('formEventCategory').value = category;
    pendingDifyData = { isAI_Priority: isPriority, ai_tags: tags, urgency_score: score };

    const tagBox = document.getElementById('difyTagContainer');
    tagBox.style.display = 'flex';
    tagBox.innerHTML = `
        <span style="font-size:11px; color:var(--oasis-ai-purple); font-weight:bold; margin-right:4px;">✨ Dify 建議：</span>
        ${tags.map(t => `<span class="ai-tag-chip">#${t}</span>`).join('')}
        ${isPriority ? '<span class="ai-priority-badge">🔥 高優先</span>' : ''}
    `;
}

// ─── ✨ 廣東話自然語言輸入（訪客阻擋） ───
async function executeAINaturalInput() {
    if (isGuest) {
        await HIG.alert("權限不足", "訪客模式為唯讀，無權寫入日程！請先登入家庭成員帳戶。");
        openAddModal('LOGIN');
        return;
    }

    const input = document.getElementById('aiQuickInput');
    const raw = input.value.trim();
    if (!raw) {
        await HIG.alert("提示", "請輸入文字，例如：聽晚八點半同嫲嫲仁安覆診");
        return;
    }

    let targetDate = selectedDateStr;
    let targetTime = "20:00";
    let category = "家庭";
    let assignee = currentUser || "鐵";
    let isPriority = false;
    let tags = [];

    const today = new Date();
    if (raw.includes("聽日") || raw.includes("聽晚") || raw.includes("聽朝")) {
        const d = new Date(today);
        d.setDate(d.getDate() + 1);
        targetDate = formatDayStr(d);
    } else if (raw.includes("後日")) {
        const d = new Date(today);
        d.setDate(d.getDate() + 2);
        targetDate = formatDayStr(d);
    }

    if (raw.includes("覆診") || raw.includes("醫院") || raw.includes("睇醫生") || raw.includes("診所") || raw.includes("食藥")) {
        category = "醫療健康";
        isPriority = true;
        tags = ["長輩醫療", "覆診"];
    } else if (raw.includes("排球") || raw.includes("打波") || raw.includes("運動")) {
        category = "體育運動";
        tags = ["體能活動"];
    } else if (raw.includes("二胡") || raw.includes("考試") || raw.includes("課")) {
        category = "學校";
        isPriority = true;
        tags = ["學業要事"];
    }

    if (raw.includes("Daddy") || raw.includes("老竇") || raw.includes("爸爸")) assignee = "Daddy";
    else if (raw.includes("Mummy") || raw.includes("媽媽") || raw.includes("阿媽")) assignee = "Mummy";
    else if (raw.includes("Jolie")) assignee = "Jolie";
    else if (raw.includes("蓓")) assignee = "蓓";
    else if (raw.includes("熹")) assignee = "熹";

    if (raw.includes("七點半") || raw.includes("7:30")) targetTime = "19:30";
    else if (raw.includes("八點半") || raw.includes("8:30")) targetTime = "20:30";
    else if (raw.includes("八點") || raw.includes("8:00")) targetTime = "20:00";
    else if (raw.includes("九點") || raw.includes("9:00")) targetTime = "21:00";

    const cleanTitle = raw.replace(/(聽日|聽晚|後日|今日|朝早|夜晚)/g, "").trim();

    const tempId = "local_" + Date.now();
    const newAct = { 
        id: tempId, 
        title: cleanTitle, 
        date: targetDate, 
        time: targetTime, 
        category, 
        assignee, 
        isAI_Priority: isPriority, 
        ai_tags: tags,
        urgency_score: isPriority ? 85 : 30
    };
    activities.unshift(newAct);
    localStorage.setItem('family_cached_activities', JSON.stringify(activities));

    selectedDateStr = targetDate;
    renderCalendar();
    renderAgenda();
    updateAISummary();

    input.value = "";
    await HIG.alert("AI 解析完成", `已智能排入：【${targetDate} ${targetTime}】\n項目：${cleanTitle}\n負責人：${assignee}`);

    try {
        const cipher = await E2EE.encrypt(cleanTitle);
        if (window.fbDb && window.fbRef && window.fbPush) {
            const ref = window.fbPush(window.fbRef(window.fbDb, "family_calendar_activities"));
            await window.fbSet(ref, { 
                title: cipher, 
                date: targetDate, 
                time: targetTime, 
                category, 
                assignee, 
                isAI_Priority: isPriority, 
                ai_tags: tags,
                updatedAt: Date.now() 
            });
        }
    } catch(e) {}
}

// ─── ➕ 儲存與修改活動 ───
function openAddModal(mode) {
    document.getElementById('editItemKey').value = "";
    document.getElementById('modalFormTitle').innerText = isGuest ? "🔒 家庭成員身分驗證" : "➕ 新增家庭行程";
    document.getElementById('modalSubmitBtn').innerText = "確認儲存至此日";
    document.getElementById('difyTagContainer').style.display = 'none';

    if (isGuest) {
        document.getElementById('loginGateSection').style.display = 'block';
        document.getElementById('eventFormFields').style.display = 'none';
    } else {
        document.getElementById('loginGateSection').style.display = 'none';
        document.getElementById('eventFormFields').style.display = 'block';
        document.getElementById('formEventAssignee').value = currentUser || "鐵";
    }

    document.getElementById('formEventTitle').value = "";
    document.getElementById('nativeEventDate').value = selectedDateStr;
    document.getElementById('nativeEventTime').value = "20:00";

    document.getElementById('eventModal').style.display = 'flex';
}

async function openEditSpecificItem(id) {
    if (isGuest) {
        await HIG.alert("權限不足", "訪客模式為唯讀，無法修改行程！請先登入。");
        openAddModal('LOGIN');
        return;
    }

    const item = activities.find(a => a && a.id === id);
    if (!item) return;
    document.getElementById('editItemKey').value = id;
    document.getElementById('modalFormTitle').innerText = "✏️ 修改家庭行程";
    document.getElementById('modalSubmitBtn').innerText = "確認更新儲存";

    document.getElementById('loginGateSection').style.display = 'none';
    document.getElementById('eventFormFields').style.display = 'block';

    document.getElementById('formEventTitle').value = getSafeTitle(item.title);
    document.getElementById('nativeEventDate').value = item.date || selectedDateStr;
    document.getElementById('nativeEventTime').value = item.time || "20:00";
    document.getElementById('formEventCategory').value = item.category || "家庭";
    document.getElementById('formEventAssignee').value = item.assignee || "全員";

    pendingDifyData = {
        isAI_Priority: item.isAI_Priority || false,
        ai_tags: item.ai_tags || [],
        urgency_score: item.urgency_score || 0
    };

    if (item.ai_tags && item.ai_tags.length > 0) {
        const tagBox = document.getElementById('difyTagContainer');
        tagBox.style.display = 'flex';
        tagBox.innerHTML = `
            <span style="font-size:11px; color:var(--oasis-ai-purple); font-weight:bold; margin-right:4px;">✨ Dify 標籤：</span>
            ${item.ai_tags.map(t => `<span class="ai-tag-chip">#${t}</span>`).join('')}
            ${item.isAI_Priority ? '<span class="ai-priority-badge">🔥 高優先</span>' : ''}
        `;
    } else {
        document.getElementById('difyTagContainer').style.display = 'none';
    }

    closeManageModal();
    document.getElementById('eventModal').style.display = 'flex';
}

function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

async function saveEvent() {
    if (isGuest) {
        await HIG.alert("權限不足", "訪客模式無法儲存任何行程！");
        return;
    }

    const title = document.getElementById('formEventTitle').value.trim();
    const date = document.getElementById('nativeEventDate').value;
    const time = document.getElementById('nativeEventTime').value || "20:00";
    const category = document.getElementById('formEventCategory').value;
    const assignee = document.getElementById('formEventAssignee').value;
    const editKey = document.getElementById('editItemKey').value;

    if (!title || !date) {
        await HIG.alert("提示", "請填寫活動名稱並選取日期！");
        return;
    }

    const isPriority = pendingDifyData.isAI_Priority || category === "重要" || category === "醫療健康";
    const ai_tags = pendingDifyData.ai_tags || [];
    const urgency_score = pendingDifyData.urgency_score || (isPriority ? 80 : 30);

    if (editKey) {
        const idx = activities.findIndex(a => a && a.id === editKey);
        if (idx !== -1) {
            activities[idx] = { id: editKey, title, date, time, category, assignee, isAI_Priority: isPriority, ai_tags, urgency_score };
        }
    } else {
        const tempId = "local_" + Date.now();
        activities.unshift({ id: tempId, title, date, time, category, assignee, isAI_Priority: isPriority, ai_tags, urgency_score });
    }

    localStorage.setItem('family_cached_activities', JSON.stringify(activities));
    selectedDateStr = date;
    renderCalendar();
    renderAgenda();
    updateAISummary();
    closeModal();

    try {
        const cipher = await E2EE.encrypt(title);
        const payload = { 
            title: cipher, 
            date, 
            time, 
            category, 
            assignee, 
            isAI_Priority: isPriority, 
            ai_tags, 
            urgency_score, 
            updatedAt: Date.now() 
        };
        if (window.fbDb && window.fbRef) {
            if (editKey && !editKey.startsWith("local_")) {
                await window.fbUpdate(window.fbRef(window.fbDb, `family_calendar_activities/${editKey}`), payload);
            } else {
                const ref = window.fbPush(window.fbRef(window.fbDb, "family_calendar_activities"));
                await window.fbSet(ref, payload);
            }
        }
    } catch(e) {}
}

// ─── ⚙️ 修改 / 刪除專用面板 ───
function openManageModal() {
    const container = document.getElementById('manageDayListContainer');
    const matched = activities.filter(a => a && a.date === selectedDateStr);

    if (matched.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:16px; color:var(--apple-text-secondary); font-size:13px;">所選日期無排定行程可供管理。</div>`;
    } else {
        container.innerHTML = matched.map(ev => {
            const theme = getMemberTheme(ev.assignee);
            return `
                <div style="background:rgba(0,0,0,0.03); border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center; border-left:3px solid ${theme.border};">
                    <div>
                        <div style="font-weight:700; font-size:14px;">${ev.time || '全日'} - ${getSafeTitle(ev.title)}</div>
                        <div style="font-size:11px; color:var(--apple-text-secondary); margin-top:2px;">
                            <span style="color:${theme.color}; font-weight:bold;">${theme.icon} ${ev.assignee || '全員'}</span> · 🏷️ ${ev.category || '家庭'}
                        </div>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="openEditSpecificItem('${ev.id}')" style="background:var(--oasis-primary); color:white; border:none; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer;">修改</button>
                        <button onclick="deleteEventItem('${ev.id}')" style="background:rgba(255,59,48,0.1); color:var(--oasis-danger); border:none; border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer;">刪除</button>
                    </div>
                </div>
            `;
        }).join('');
    }
    document.getElementById('manageModal').style.display = 'flex';
}
function closeManageModal() { document.getElementById('manageModal').style.display = 'none'; }

async function deleteEventItem(id) {
    if (isGuest) {
        await HIG.alert("權限不足", "訪客無法刪除，請先登入！");
        return;
    }
    const ok = await HIG.confirm("確認刪除", "確定要刪除這項行程嗎？");
    if (!ok) return;

    activities = activities.filter(a => a && a.id !== id);
    localStorage.setItem('family_cached_activities', JSON.stringify(activities));
    renderCalendar();
    renderAgenda();
    updateAISummary();
    closeManageModal();

    if (!id.startsWith("local_") && window.fbDb && window.fbRef && window.fbRemove) {
        window.fbRemove(window.fbRef(window.fbDb, `family_calendar_activities/${id}`));
    }
}

function handleAuthBadgeClick() {
    if (isGuest) openAddModal('LOGIN');

async function submitLogin() {
    const member = document.getElementById('loginSelectMember').value;
    const pwd = document.getElementById('loginPasswordInput').value.trim();
    if (!pwd) {
        await HIG.alert("提示", "請輸入密碼！");
        return;
    }
    const email = member === "iron" ? "ironijkl@gmail.com" : `ironijkl+${member}@gmail.com`;

    try {
        await window.fbSignIn(window.fbAuth, email, pwd);
        const nameMap = { iron: "鐵", daddy: "Daddy", mummy: "Mummy", jolie: "Jolie", leisel: "蓓", karis: "熹" };
        applyLoginState(nameMap[member] || "鐵");
        closeModal();
        await HIG.alert("成功", `歡迎回來，${nameMap[member]}！已解鎖家庭管理與編輯權限。`);
    } catch (e) {
        await HIG.alert("登入失敗", "密碼不正確，請重新檢查！");
    }
}

async function logoutAccount() {
    const ok = await HIG.confirm("退出登入", "確定要切換為訪客唯讀模式嗎？");
    if (ok) {
        renderGuestState();
        if (window.fbSignOut && window.fbAuth) await window.fbSignOut(window.fbAuth);
    }
}

async function requestAccountDeletion() {
    const user = window.fbAuth?.currentUser;
    if (!user) {
        await HIG.alert("錯誤", "未登入帳號！");
        return;
    }
    const ok = await HIG.confirm("永久註銷帳號", "此操作不可復原，將刪除此帳號登入憑證。確認繼續？");
    if (!ok) return;

    const pwd = await HIG.prompt("驗證身分", "請輸入密碼以確認註銷：");
    if (!pwd) return;

    try {
        const cred = window.fbEmailAuthProvider.credential(user.email, pwd);
        await window.fbReauth(user, cred);
        await window.fbDeleteUser(user);
        localStorage.clear();
        renderGuestState();
        closeModal();
        await HIG.alert("完成", "帳號已成功註銷並刪除。");
        location.reload();
    } catch (e) {
        await HIG.alert("失敗", "註銷失敗：" + e.message);
    }
}

function shareWhatsApp() {
    const dayActs = activities.filter(a => a && a.date === selectedDateStr);
    if (dayActs.length === 0) {
        HIG.alert("提示", "今日無任何行程可分享！");
        return;
    }
    let msg = `💡【麟李家庭日程 · ${selectedDateStr}】\n\n`;
    dayActs.forEach((a, i) => {
        msg += `${i + 1}. ⏰ ${a.time || '全日'} - ${getSafeTitle(a.title)} (👤 ${a.assignee || '全員'})\n`;
    });
    msg += `\n請全家留意時間安排！❤️`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
}
